[build]
builder = "paketobuildpacks/builder:base"

[env]
PORT = "8080"
BP_PYTHON_VERSION = "3.10.*"
AUTO_MIGRATE = "1"

[[services]]
name = "sirio-arabia-crm"
start = "gunicorn backend.app:app -b 0.0.0.0:${PORT} --workers 1 --threads 4 --timeout 120 --access-logfile - --error-logfile - --log-level info --capture-output"
