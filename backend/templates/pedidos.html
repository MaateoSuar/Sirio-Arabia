{% extends 'layout.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h1 class="h4 mb-0">Registro de Venta / Pedido</h1>
  <div>
    <button class="btn btn-outline-success" type="button" id="pending-open-btn">Pendientes</button>
  </div>
</div>
<!-- Modal Pendientes -->
<div class="modal fade" id="draftsModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Pendientes</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="table-responsive">
          <table class="table table-sm align-middle mb-0">
            <thead>
              <tr>
                <th>Cliente</th>
                <th>Empresa</th>
                <th class="text-end">Acciones</th>
              </tr>
            </thead>
            <tbody id="drafts-tbody">
              <tr><td colspan="3" class="text-center text-muted">Sin borradores</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cerrar</button>
      </div>
    </div>
  </div>
</div>
<!-- Modal Confirmación Eliminar Borrador -->
<div class="modal fade" id="confirmDeleteDraftModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Eliminar borrador</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p id="confirmDeleteDraftText" class="mb-0">¿Querés eliminar este borrador?</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-danger" id="confirmDeleteDraftBtn">Eliminar</button>
      </div>
    </div>
  </div>
</div>
<div class="card mb-4">
  <div class="card-body">
    <div id="pedido-alert" class="alert alert-warning py-2 px-3 mb-3 d-none" role="alert" style="font-size:.9rem"></div>
    <form id="pedido-form" class="row g-2 g-md-3" method="post" action="{{ url_for('main.pedidos_create') }}" enctype="multipart/form-data">
      <div class="col-md-3">
        <label class="form-label">Fecha de compra</label>
        <input type="text" class="form-control" id="pedido_fecha" name="fecha_compra" value="{{ today }}" data-datepicker>
      </div>
      <div class="col-md-3">
        <label class="form-label">Cliente</label>
        <select class="form-select" id="pedido_cliente" name="client_id" required onchange="window.__onSelChange && window.__onSelChange()">
          <option value="">Cliente...</option>
          {% for c in clientes %}
            <option value="{{ c.id }}" data-razon="{{ c.apellido }}" data-nombre="{{ c.nombre }}" data-forma-pago="{{ (c.forma_pago_habitual or '') }}">{{ c.apellido }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-3" id="pedido_branch_col" style="display:none;">
        <label class="form-label">Sucursal del cliente</label>
        <select class="form-select" id="pedido_branch" name="branch_id">
          <option value="">Sucursal del cliente...</option>
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Empresa</label>
        <select class="form-select" id="pedido_empresa" name="company_id" required onchange="window.__onSelChange && window.__onSelChange()">
          <option value="">Empresa...</option>
        </select>
      </div>
      <div class="col-12">
        <input type="text" class="form-control" id="pedido_nota" name="nota" placeholder="Nota">
      </div>
      <div class="col-12">
        <textarea class="form-control" id="pedido_descripcion" name="descripcion" rows="6" placeholder="Descripción del pedido (puedes pegar texto desde WhatsApp)"></textarea>
      </div>
      <div class="col-12">
        <input type="file" name="attachments" id="pedido_attachments" class="form-control" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.txt,.csv,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/plain,text/csv">
      </div>
      <div class="col-12">
        <div class="d-flex justify-content-between align-items-center">
          <h6 class="mb-2">Pedidos anteriores del cliente en esta empresa</h6>
          <button class="btn btn-sm btn-outline-secondary" type="button" id="refresh-prev">Actualizar</button>
        </div>
        <div id="prev-orders" class="list-group small"></div>
      </div>
      <div class="col-12">
        <div class="d-flex gap-2 flex-wrap">
          <button class="btn btn-outline-secondary" type="button" id="preview-btn">Vista previa</button>
          <button class="btn btn-secondary" type="button" id="copy-preview-btn">Copiar borrador</button>
        </div>
        <textarea class="form-control mt-2" id="pedido_preview" rows="4" placeholder="Borrador del pedido"></textarea>
      </div>
      <div class="col-12">
        <div class="d-flex align-items-center justify-content-between">
          <label class="form-label m-0" style="color:#0f766e; font-weight:600">Destinatarios del pedido</label>
          <div class="d-flex gap-2">
            <input type="email" class="form-control form-control-sm" id="new_to_input" placeholder="Agregar mail" style="max-width:260px">
            <button class="btn btn-sm btn-outline-secondary" type="button" id="btnAddTo">Agregar</button>
          </div>
        </div>
        <div id="to-checklist" class="border rounded p-2 mt-2" style="max-height:200px; overflow:auto"></div>
        <div class="d-flex justify-content-end mt-2">
          <button type="button" id="btnConfirmarTo" class="btn btn-sm btn-primary">Confirmar selección</button>
        </div>
        <div class="mt-2">
          <div class="text-muted small" style="color:#0f766e !important; font-weight:600">Enviar a</div>
          <div id="to-selected" class="mt-1"></div>
        </div>
      </div>
      <div class="col-md-4">
        <input type="number" step="0.01" class="form-control" id="pedido_precio" name="precio_final" placeholder="Precio final (opcional)">
      </div>
      <div class="col-md-4">
        <div id="pedido_pago_box" class="border border-secondary rounded-3 p-2">
          <div class="mb-2">
            <label class="form-label m-0">Tipo de comprobante</label>
            <div class="btn-group w-100 mt-1" role="group" aria-label="Tipo de comprobante" id="pedido_tipo_group">
              <button type="button" class="btn btn-sm btn-outline-primary" data-tipo="FACTURA" id="btn_tipo_factura">Factura</button>
              <button type="button" class="btn btn-sm btn-outline-danger" data-tipo="REMITO" id="btn_tipo_remito">Remito</button>
            </div>
            <input type="hidden" id="pedido_tipo_comprobante" name="tipo_comprobante" value="">
          </div>
          <label class="form-label">Forma de pago</label>
          <select class="form-select" id="pedido_forma_pago" name="forma_pago"></select>
        </div>
      </div>
      <div class="col-md-4">
        <label class="form-label">Plazo de pago (días)</label>
        <input type="number" class="form-control" id="pedido_plazo_pago" name="plazo_pago_dias" min="0" placeholder="Plazo">
      </div>
      <div class="col-12 d-flex flex-wrap gap-2">
        <button class="btn btn-outline-success w-100 w-md-auto" type="button" id="save-pending-btn">Dejar pendiente</button>
        <button class="btn btn-success w-100 w-md-auto" type="button" id="gmail-draft-btn">Enviar pedido por mail</button>
        <button class="btn btn-outline-secondary w-100 w-md-auto" type="submit">Crear Pedido</button>
      </div>
    </form>
  </div>
</div>
<script>
  (function(){
    const clienteSel = document.getElementById('pedido_cliente');
    const empresaSel = document.getElementById('pedido_empresa');
    const mailInput = document.getElementById('pedido_mail_pedido');
    const notaInput = document.getElementById('pedido_nota');
    const descInput = document.getElementById('pedido_descripcion');
    const precioInput = document.getElementById('pedido_precio');
    const formaPagoSel = document.getElementById('pedido_forma_pago');
    const plazoPagoInput = document.getElementById('pedido_plazo_pago');
    const fechaInput = document.getElementById('pedido_fecha');
    const branchSel = document.getElementById('pedido_branch');
    const branchCol = document.getElementById('pedido_branch_col');
    const form = document.getElementById('pedido-form');
    const alertBox = document.getElementById('pedido-alert');
    const prevWrap = document.getElementById('prev-orders');
    const refreshPrevBtn = document.getElementById('refresh-prev');
    const previewBtn = document.getElementById('preview-btn');
    const copyPrevBtn = document.getElementById('copy-preview-btn');
    const previewTa = document.getElementById('pedido_preview');
    const draftsOpenBtn = document.getElementById('pending-open-btn');
    const draftsTbody = document.getElementById('drafts-tbody');
    const confirmDelModalEl = document.getElementById('confirmDeleteDraftModal');
    const confirmDelText = document.getElementById('confirmDeleteDraftText');
    const confirmDelBtn = document.getElementById('confirmDeleteDraftBtn');
    // destinatarios
    const toBox = document.getElementById('to-checklist');
    const toList = document.getElementById('to-selected');
    const toAddBtn = document.getElementById('btnAddTo');
    const toInput = document.getElementById('new_to_input');
    let toConfirmed = new Set();
    // Guardar opciones completas de empresas por si se requiere restaurar (no usado actualmente)
    const empresaAllOptions = Array.from(empresaSel?.options || []);
    let pendingDeleteDraft = null;
    let lastCompanyId = '';

    // Opciones de forma de pago según tipo de comprobante
    const paymentOptions = {
      FACTURA: [
        { value: '', label: '-' },
        { value: 'EFECTIVO', label: 'Efectivo' },
        { value: 'TRANSFERENCIA', label: 'Transferencia' },
        { value: 'CHEQUE', label: 'E-cheq' },
        { value: 'CHEQUE', label: 'Cheque Físico Terceros' },
        { value: 'CHEQUE', label: 'Cheque Físico Propio' },
      ],
      REMITO: [
        { value: '', label: '-' },
        { value: 'EFECTIVO', label: 'Efectivo' },
        { value: 'TRANSFERENCIA', label: 'Transferencia' },
        { value: 'CHEQUE', label: 'E-cheq' },
        { value: 'CHEQUE', label: 'Cheque Físico Terceros' },
        { value: 'CHEQUE', label: 'Cheque Físico Propio' },
      ],
    };

    function populateFormaPago(tipo){
      if (!formaPagoSel) return;
      const opts = paymentOptions[tipo] || paymentOptions.FACTURA;
      const current = formaPagoSel.value;
      formaPagoSel.innerHTML = '';
      opts.forEach(o => {
        const opt = document.createElement('option');
        opt.value = o.value;
        opt.textContent = o.label;
        formaPagoSel.appendChild(opt);
      });
      const hasCurrent = opts.some(o => o.value && o.value === current);
      if (hasCurrent) {
        formaPagoSel.value = current;
      }
    }

    // =========================
    // Borradores (localStorage)
    // =========================
    function draftKey(clientId, companyId){
      return `pedido_draft_${clientId}_${companyId}`;
    }
    function collectDraft(){
      const cid = clienteSel?.value || '';
      const eid = empresaSel?.value || '';
      if (!cid || !eid) return null;
      const clienteOpt = clienteSel.options[clienteSel.selectedIndex];
      const empresaOpt = empresaSel.options[empresaSel.selectedIndex];
      return {
        client_id: String(cid),
        company_id: String(eid),
        client_label: (clienteOpt?.getAttribute('data-razon') || clienteOpt?.text || ''),
        company_label: (empresaOpt?.text || ''),
        branch_id: branchSel?.value || '',
        sucursal: (branchSel && branchSel.value) ? (branchSel.options[branchSel.selectedIndex]?.text || '') : '',
        nota: notaInput?.value || '',
        descripcion: descInput?.value || '',
        precio_final: precioInput?.value || '',
        forma_pago: formaPagoSel?.value || '',
        plazo_pago_dias: plazoPagoInput?.value || '',
        fecha_compra: fechaInput?.value || ''
      };
    }
    function saveDraft(){
      try{
        const d = collectDraft();
        if (!d) return;
        localStorage.setItem(draftKey(d.client_id, d.company_id), JSON.stringify(d));
      }catch(e){/* noop */}
    }
    function listDrafts(){
      const items = [];
      try{
        for (let i=0;i<localStorage.length;i++){
          const k = localStorage.key(i);
          if (!k || !k.startsWith('pedido_draft_')) continue;
          try{
            const v = JSON.parse(localStorage.getItem(k)||'null');
            if (v && v.client_id && v.company_id) items.push(v);
          }catch(err){/* ignore bad */}
        }
      }catch(e){}
      // ordenar por client_label/company_label para vista estable
      items.sort((a,b)=>{
        const ca = (a.client_label||'').localeCompare(b.client_label||'');
        if (ca!==0) return ca;
        return (a.company_label||'').localeCompare(b.company_label||'');
      });
      return items;
    }
    function populateDraftsModal(){
      if (!draftsTbody) return;
      const drafts = listDrafts();
      draftsTbody.innerHTML = '';
      if (!drafts.length){
        draftsTbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted">Sin borradores</td></tr>';
        return;
      }
      const fr = document.createDocumentFragment();
      for (const d of drafts){
        const tr = document.createElement('tr');
        const tdC = document.createElement('td'); tdC.textContent = d.client_label || d.client_id;
        const tdE = document.createElement('td'); tdE.textContent = d.company_label || d.company_id;
        const tdA = document.createElement('td'); tdA.className = 'text-end d-flex justify-content-end gap-2';
        const btn = document.createElement('button'); btn.type='button'; btn.className='btn btn-sm btn-outline-primary'; btn.textContent='Cargar';
        btn.addEventListener('click', async ()=>{
          // Seleccionar cliente y cargar empresas correspondientes
          if (clienteSel){
            clienteSel.value = String(d.client_id);
            clienteSel.dispatchEvent(new Event('change'));
          }
          // Esperar a que se carguen empresas para ese cliente
          try{
            // loadCompanies está en este scope; volver a cargar para el cliente actual
            await loadCompanies(String(d.client_id));
          }catch(e){}
          if (empresaSel){
            empresaSel.value = String(d.company_id);
            empresaSel.dispatchEvent(new Event('change'));
          }
          applyDraft(d);
          // cerrar modal si existe bootstrap
          const modalEl = document.getElementById('draftsModal');
          const M = window.bootstrap && window.bootstrap.Modal;
          if (M && modalEl) {
            try{ M.getOrCreateInstance(modalEl).hide(); }catch(e){}
          }
        });
        const delBtn = document.createElement('button'); delBtn.type='button'; delBtn.className='btn btn-sm btn-outline-danger'; delBtn.textContent='Eliminar';
        delBtn.addEventListener('click', ()=>{
          pendingDeleteDraft = { client_id: String(d.client_id), company_id: String(d.company_id), client_label: d.client_label, company_label: d.company_label };
          if (confirmDelText){
            const cl = d.client_label || d.client_id; const co = d.company_label || d.company_id;
            confirmDelText.textContent = `¿Querés eliminar el borrador de ${cl} - ${co}?`;
          }
          const M = window.bootstrap && window.bootstrap.Modal;
          if (M && confirmDelModalEl){ M.getOrCreateInstance(confirmDelModalEl).show(); }
          else if (confirmDelModalEl){ confirmDelModalEl.classList.add('show'); confirmDelModalEl.style.display='block'; }
        });
        tdA.appendChild(btn);
        tdA.appendChild(delBtn);
        tr.appendChild(tdC); tr.appendChild(tdE); tr.appendChild(tdA);
        fr.appendChild(tr);
      }
      draftsTbody.appendChild(fr);
    }
    function applyDraft(d){
      if (!d) return;
      try{
        if (fechaInput) fechaInput.value = d.fecha_compra || fechaInput.value || '';
        if (notaInput) notaInput.value = d.nota || '';
        if (descInput) descInput.value = d.descripcion || '';
        if (precioInput) precioInput.value = d.precio_final || '';
        if (formaPagoSel) formaPagoSel.value = d.forma_pago || '';
        if (plazoPagoInput) plazoPagoInput.value = d.plazo_pago_dias || '';
        if (branchSel){
          // asegurar opción de sucursal si viene un ID que aún no está cargado
          const id = String(d.branch_id || '');
          if (id){
            let found = false;
            Array.from(branchSel.options).forEach(o=>{ if (String(o.value)===id) found = true; });
            if (!found){
              const opt = document.createElement('option'); opt.value = id; opt.textContent = d.sucursal || ('Sucursal '+id);
              branchSel.appendChild(opt);
            }
            branchSel.value = id;
          } else {
            branchSel.value = '';
          }
        }
        if (previewTa) previewTa.value = buildPreviewText();
      }catch(e){}
    }
    function tryLoadDraftForSelection(){
      const cid = clienteSel?.value || '';
      const eid = empresaSel?.value || '';
      if (!cid || !eid) return;
      try{
        const raw = localStorage.getItem(draftKey(cid, eid));
        if (!raw) return;
        const d = JSON.parse(raw);
        if (d) applyDraft(d);
      }catch(e){}
    }
    function clearFormForClientChange(){
      try{
        if (notaInput) notaInput.value = '';
        if (descInput) descInput.value = '';
        if (precioInput) precioInput.value = '';
        if (formaPagoSel) formaPagoSel.value = '';
        if (plazoPagoInput) plazoPagoInput.value = '';
        if (fechaInput) {
          // mantener fecha actual visible; si se quiere, se puede resetear a today (ya viene en value por backend)
          // fechaInput.value = fechaInput.getAttribute('value') || '';
        }
        if (branchSel){
          branchSel.innerHTML = '<option value="">Sucursal del cliente...</option>';
          branchSel.value = '';
        }
        if (branchCol){
          branchCol.style.display = 'none';
        }
        const attach = document.getElementById('pedido_attachments');
        if (attach) attach.value = '';
      }catch(e){}
    }

    function updateEnabledBySelection(){ return; }

    async function loadCompanies(clientId){
      if(!empresaSel) return;
      empresaSel.innerHTML = '<option value="">Empresa...</option>';
      if (mailInput) mailInput.value = '';
      if(!clientId) return;
      try{
        const res = await fetch(`/api/clientes/${clientId}/empresas`);
        const items = await res.json();
        if (!Array.isArray(items)) return;
        for(const e of items){
          const opt = document.createElement('option');
          opt.value = e.id;
          opt.textContent = e.label;
          opt.setAttribute('data-mail', e.mail_pedido || '');
          opt.setAttribute('data-mail-pago', e.mail_pago || '');
          opt.setAttribute('data-pedido-std', e.pedido_estandar_recomendado || '');
          opt.setAttribute('data-tipo-default', (e.comprobante_tipo || '').toString());
          opt.setAttribute('data-pago-default', (e.forma_pago_default || '').toString());
          opt.setAttribute('data-plazo', ((e.plazo_pago_dias != null ? e.plazo_pago_dias : e.plazo_pago_promedio_dias) || '').toString());
          empresaSel.appendChild(opt);
        }
      }catch(e){/* noop */}
    }

    // Cargar empresas al seleccionar cliente
    clienteSel?.addEventListener('change', async ()=>{
      const id = clienteSel.value;
      clearFormForClientChange();
      resetRecipients();
      lastCompanyId = '';
      delete document.body.dataset.tipoTouched;
      if (formaPagoSel) delete formaPagoSel.dataset.touched;
      if (plazoPagoInput) delete plazoPagoInput.dataset.touched;
      if (!id){
        if (empresaSel) empresaSel.innerHTML = '<option value="">Empresa...</option>';
        if (prevWrap) prevWrap.innerHTML = '';
        updateEnabledBySelection();
        return;
      }
      await loadCompanies(id);
      updateEnabledBySelection();
    });

    // Autorellenar mail pedido al seleccionar empresa leyendo data-mail del option seleccionado
    empresaSel?.addEventListener('change', ()=>{
      // Al cambiar empresa, NO borrar sucursales ni otros datos del cliente;
      // sólo actualizar mails, pedidos anteriores y destinatarios.
      const opt = empresaSel.options[empresaSel.selectedIndex];
      const currCompanyId = (empresaSel && empresaSel.value) ? String(empresaSel.value) : '';
      if (currCompanyId !== lastCompanyId) {
        // reset flags de defaults por cambio real de empresa
        delete document.body.dataset.tipoTouched;
        if (formaPagoSel) delete formaPagoSel.dataset.touched;
        if (plazoPagoInput) delete plazoPagoInput.dataset.touched;
      }
      lastCompanyId = currCompanyId;
      if (mailInput){
        try{
          mailInput.value = opt ? (opt.getAttribute('data-mail') || '') : '';
        } catch(e) {}
      }

      // Default plazo de pago por vínculo Cliente+Empresa (si el usuario todavía no lo tocó)
      try{
        const defPlazo = opt ? (opt.getAttribute('data-plazo') || '') : '';
        if (plazoPagoInput && !plazoPagoInput.dataset.touched && String(defPlazo || '').trim() !== '') {
          plazoPagoInput.value = String(defPlazo);
        }
      }catch(e) {}

      // Default: pedido estándar recomendado de la empresa (si el usuario todavía no escribió nada)
      updateEnabledBySelection();
      // Intentar cargar borrador si ya hay empresa seleccionada
      tryLoadDraftForSelection();

      // Default forma de pago del cliente (si existe) o EFECTIVO
      try {
        const opt = clienteSel.options[clienteSel.selectedIndex];
        const fp = opt ? ((opt.getAttribute('data-forma-pago') || '').toString().trim().toUpperCase()) : '';
        populateFormaPago('FACTURA');
        if (formaPagoSel && !formaPagoSel.dataset.touched) {
          formaPagoSel.value = fp || 'EFECTIVO';
        }
      } catch(e) {}
    });

    // Validación antes de enviar: evitar salir de la página con Bad Request
    form?.addEventListener('submit', function(e){
      const cid = (clienteSel && clienteSel.value) || '';
      const eid = (empresaSel && empresaSel.value) || '';
      const tipo = (document.getElementById('pedido_tipo_comprobante') && document.getElementById('pedido_tipo_comprobante').value) || '';
      let msg = '';
      if (!cid) msg = 'Debe seleccionar un cliente registrado.';
      else if (!eid) msg = 'Debe seleccionar una empresa vinculada al cliente.';
      else if (!tipo) msg = 'Debe seleccionar si es Factura o Remito.';
      if (msg) {
        e.preventDefault();
        if (alertBox) {
          alertBox.textContent = msg;
          alertBox.classList.remove('d-none');
        } else {
          alert(msg);
        }
        return false;
      }
      // ocultar alerta si todo ok
      if (alertBox) alertBox.classList.add('d-none');
      // eliminar borrador del par al crear pedido
      try{
        const cid = clienteSel?.value || '';
        const eid = empresaSel?.value || '';
        if (cid && eid) localStorage.removeItem(draftKey(cid, eid));
      }catch(err){}
    });

    function buildPreviewText(){
      const empresaOpt = empresaSel.options[empresaSel.selectedIndex];
      const clienteOpt = clienteSel.options[clienteSel.selectedIndex];
      const clienteText = clienteOpt?.getAttribute('data-razon') || clienteOpt?.text || '';
      const empresaText = empresaOpt?.text || '';
      const branchOpt2 = branchSel?.options[branchSel.selectedIndex];
      const nota = notaInput?.value || '';
      const desc = descInput?.value || '';
      let title = `Pedido ${clienteText} - ${empresaText}`;
      if (branchSel && branchSel.value && branchOpt2) { title += ` / Sucursal: ${branchOpt2.text}`; }
      const lines = [
        title,
        '',
        nota,
        '',
        desc
      ];
      return lines.join('\n');
    }

    // Guardado automático al escribir
    ;[notaInput, descInput, precioInput, formaPagoSel, branchSel, fechaInput].forEach(el=>{
      if (!el) return;
      el.addEventListener('input', saveDraft);
      el.addEventListener('change', saveDraft);
    });

    // Marcar cuando el usuario tocó la descripción para no pisarla con defaults
    if (descInput) {
      descInput.addEventListener('input', function(){
        descInput.dataset.touched = '1';
      });
    }

    // Marcar cuando el usuario tocó la forma de pago
    if (formaPagoSel) {
      formaPagoSel.addEventListener('change', function(){
        formaPagoSel.dataset.touched = '1';
      });
    }

    // Marcar cuando el usuario tocó el plazo de pago
    if (plazoPagoInput) {
      plazoPagoInput.addEventListener('input', function(){
        plazoPagoInput.dataset.touched = '1';
      });
    }

    // Abrir modal de borradores
    draftsOpenBtn?.addEventListener('click', ()=>{
      populateDraftsModal();
      const modalEl = document.getElementById('draftsModal');
      const M = window.bootstrap && window.bootstrap.Modal;
      if (M) {
        M.getOrCreateInstance(modalEl).show();
      } else if (modalEl) {
        modalEl.classList.add('show'); modalEl.style.display='block';
        if (!document.getElementById('draftsModalBackdrop')){
          const bd = document.createElement('div'); bd.id='draftsModalBackdrop'; bd.className='modal-backdrop fade show'; document.body.appendChild(bd);
        }
      }
      // asegurar estado correcto de habilitación
      updateEnabledBySelection();
    });

    // Confirmación de eliminación de borrador
    confirmDelBtn?.addEventListener('click', ()=>{
      if (!pendingDeleteDraft) return;
      try {
        localStorage.removeItem(draftKey(pendingDeleteDraft.client_id, pendingDeleteDraft.company_id));
      } catch(e) {}
      // Actualizar tabla
      try { populateDraftsModal(); } catch(e) {}
      // Cerrar modal de confirmación
      const M = window.bootstrap && window.bootstrap.Modal;
      if (M && confirmDelModalEl){ try{ M.getOrCreateInstance(confirmDelModalEl).hide(); }catch(e){} }
      else if (confirmDelModalEl){ confirmDelModalEl.classList.remove('show'); confirmDelModalEl.style.display='none'; }
      pendingDeleteDraft = null;
    });

    // Botón Dejar pendiente: guarda y actualiza la lista
    const savePendingBtn = document.getElementById('save-pending-btn');
    savePendingBtn?.addEventListener('click', ()=>{
      const cid = clienteSel?.value || '';
      const eid = empresaSel?.value || '';
      if (!cid || !eid){
        alert('Seleccioná Cliente y Empresa antes de dejar pendiente.');
        return;
      }
      const d = collectDraft();
      if (!d){ alert('Seleccioná Cliente y Empresa antes.'); return; }
      try { localStorage.setItem(draftKey(d.client_id, d.company_id), JSON.stringify(d)); } catch(e){}
      // feedback simple
      try { populateDraftsModal(); } catch(e){}
      // Limpiar el formulario como preticket
      clearFormForClientChange();
      // opcional: limpiar preview
      if (previewTa) previewTa.value = '';
      // limpiar destinatarios
      resetRecipients();
    });

    // Exponer handler para onchange inline de selects
    window.__onSelChange = function(){
      try { updateEnabledBySelection(); } catch(e){}
    };

    // Estado inicial
    updateEnabledBySelection();
    const tipoHidden = document.getElementById('pedido_tipo_comprobante');
    const btnFactura = document.getElementById('btn_tipo_factura');
    const btnRemito = document.getElementById('btn_tipo_remito');
    const pagoBox = document.getElementById('pedido_pago_box');
    function setTipo(tipo){
      if (tipoHidden) tipoHidden.value = tipo;
      populateFormaPago(tipo);
      if (btnFactura && btnRemito){
        if (tipo === 'FACTURA'){
          btnFactura.classList.add('btn-primary');
          btnFactura.classList.remove('btn-outline-primary');
          btnRemito.classList.remove('btn-danger');
          btnRemito.classList.add('btn-outline-danger');
        } else {
          btnRemito.classList.add('btn-danger');
          btnRemito.classList.remove('btn-outline-danger');
          btnFactura.classList.remove('btn-primary');
          btnFactura.classList.add('btn-outline-primary');
        }
      }
      if (pagoBox){
        if (tipo === 'FACTURA'){
          pagoBox.classList.add('border-primary');
          pagoBox.classList.remove('border-danger');
          pagoBox.classList.remove('border-secondary');
        } else {
          pagoBox.classList.add('border-danger');
          pagoBox.classList.remove('border-primary');
          pagoBox.classList.remove('border-secondary');
        }
      }
    }
    if (btnFactura){
      btnFactura.addEventListener('click', function(){ document.body.dataset.tipoTouched = '1'; setTipo('FACTURA'); });
    }
    if (btnRemito){
      btnRemito.addEventListener('click', function(){ document.body.dataset.tipoTouched = '1'; setTipo('REMITO'); });
    }
    // Inicial: sin tipo seleccionado; opciones de forma de pago disponibles igual
    populateFormaPago('FACTURA');
    // Si al cargar la página ya hay selección, intentar cargar borrador
    tryLoadDraftForSelection();

    async function loadPrevOrders(){
      if(!prevWrap) return;
      prevWrap.innerHTML = '';
      const cid = clienteSel?.value; const eid = empresaSel?.value;
      if(!cid || !eid) return;
      try{
        const res = await fetch(`/api/pedidos/anteriores?client_id=${encodeURIComponent(cid)}&company_id=${encodeURIComponent(eid)}&limit=10`);
        const items = await res.json();
        if(!Array.isArray(items) || items.length===0){ prevWrap.innerHTML = '<div class="text-muted">Sin pedidos anteriores</div>'; return; }
        const fr = document.createDocumentFragment();
        items.forEach((o)=>{
          const row = document.createElement('div');
          row.className = 'list-group-item';
          const showDate = String((o.fecha_compra_date || o.created_date || '')).trim();
          const dtTxt = showDate ? showDate.split('-').reverse().join('/') : '';
          const prev = (o.descripcion||'').split('\n').find(Boolean) || (o.nota||'');
          const header = document.createElement('button');
          header.type = 'button';
          header.className = 'btn btn-link p-0 text-decoration-none';
          header.style.fontWeight = '600';
          header.textContent = dtTxt || 'Pedido';
          const preview = document.createElement('div');
          preview.className = 'text-muted';
          preview.textContent = prev || '';
          const detail = document.createElement('div');
          detail.className = 'mt-2 d-none';
          const pre = document.createElement('pre');
          pre.className = 'mb-2';
          pre.style.whiteSpace = 'pre-wrap';
          pre.style.fontFamily = 'inherit';
          pre.textContent = ((o.nota||'') ? (o.nota + "\n\n") : '') + (o.descripcion||'');
          const copyBtn = document.createElement('button');
          copyBtn.type = 'button';
          copyBtn.className = 'btn btn-sm btn-outline-primary';
          copyBtn.textContent = 'Copiar pedido';
          copyBtn.addEventListener('click', ()=>{
            notaInput.value = o.nota || '';
            descInput.value = o.descripcion || '';
            try {
              const iso = String((o.fecha_compra_date || o.created_date || '')).trim();
              if (fechaInput) {
                if (fechaInput._flatpickr) {
                  fechaInput._flatpickr.setDate(iso || '', true, 'Y-m-d');
                } else {
                  fechaInput.value = iso || '';
                }
              }
            } catch(e) {}
            if (previewTa) previewTa.value = buildPreviewText();
          });
          detail.appendChild(pre);
          detail.appendChild(copyBtn);
          header.addEventListener('click', ()=>{
            detail.classList.toggle('d-none');
          });
          row.appendChild(header);
          row.appendChild(preview);
          row.appendChild(detail);
          fr.appendChild(row);
        });
        prevWrap.appendChild(fr);
      }catch(e){ prevWrap.innerHTML = '<div class="text-danger">Error al cargar</div>'; }
    }

    refreshPrevBtn?.addEventListener('click', loadPrevOrders);
    previewBtn?.addEventListener('click', ()=>{ previewTa.value = buildPreviewText(); });
    copyPrevBtn?.addEventListener('click', async ()=>{
      const txt = previewTa?.value || buildPreviewText();
      try{ await navigator.clipboard.writeText(txt); }catch(e){}
    });

    function resetRecipients(){
      toConfirmed = new Set();
      if (toBox) toBox.innerHTML = '';
      if (toList) toList.innerHTML = '<span class="text-muted">Ninguno</span>';
    }
    function renderRecipients(){
      if (!toList) return;
      if (toConfirmed.size === 0){
        toList.innerHTML = '<span class="text-muted">Ninguno</span>';
        return;
      }
      const chips = [];
      for (const em of toConfirmed){
        const safe = String(em).replace(/"/g, '&quot;');
        chips.push(`<span class="badge bg-success text-white me-1 mb-1 d-inline-flex align-items-center">${safe}<button type="button" class="btn-close btn-close-white btn-sm ms-1 js-remove-to" data-email="${safe}" aria-label="Quitar"></button></span>`);
      }
      toList.innerHTML = chips.join('');
    }
    function addRecipientToChecklist(email){
      if (!toBox || !email) return;
      const id = 'to_' + btoa(email).replace(/=+/g,'');
      if (toBox.querySelector('#'+id)) return;
      const row = document.createElement('div'); row.className='form-check';
      const chk = document.createElement('input'); chk.type='checkbox'; chk.className='form-check-input js-to-chk'; chk.id=id; chk.value=email;
      const lbl = document.createElement('label'); lbl.className='form-check-label'; lbl.setAttribute('for', id); lbl.textContent=email;
      row.appendChild(chk); row.appendChild(lbl); toBox.appendChild(row);
    }
    function confirmRecipients(){
      if (!toBox) return;
      toBox.querySelectorAll('.js-to-chk:checked').forEach(chk=>{ const val = String(chk.value).trim(); if (val) toConfirmed.add(val); chk.checked=false; });
      renderRecipients();
    }
    function loadRecipientsFromCompany(){
      resetRecipients();
      const opt = empresaSel?.options[empresaSel.selectedIndex];
      const raw = opt ? (opt.getAttribute('data-mail') || '') : '';
      const pago = opt ? (opt.getAttribute('data-mail-pago') || '') : '';
      const merged = [raw, pago].filter(Boolean).join(',');
      if (!merged) { renderRecipients(); return; }
      merged.split(',').map(s=>s.trim()).filter(Boolean).forEach(addRecipientToChecklist);
      renderRecipients();
    }
    document.addEventListener('click', function(e){
      const t = e.target;
      if (t && t.id === 'btnConfirmarTo'){ e.preventDefault(); confirmRecipients(); }
      if (t && t.id === 'btnAddTo'){
        e.preventDefault(); const val = (toInput && toInput.value || '').trim(); if (val){ addRecipientToChecklist(val); toInput.value=''; }
      }
      const btn = t && (t.classList && (t.classList.contains('js-remove-to') ? t : t.closest && t.closest('.js-remove-to')));
      if (btn){
        e.preventDefault();
        const em = btn.getAttribute('data-email') || '';
        if (em){ toConfirmed.delete(em); renderRecipients(); }
      }
    });

    // Datepicker estético (flatpickr)
    (function(){
      function mount(){
        try{
          var nodes = document.querySelectorAll('input[data-datepicker]');
          if (!nodes.length) return;
          nodes.forEach(function(el){
            if (el._flatpickr) return;
            flatpickr(el, {
              altInput: true,
              altFormat: 'd/m/Y',
              dateFormat: 'Y-m-d',
              allowInput: true
            });
          });
        }catch(e){}
      }
      if (typeof window.flatpickr === 'function') {
        mount();
      } else {
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/flatpickr';
        s.onload = mount;
        document.head.appendChild(s);
        var l = document.createElement('link');
        l.rel = 'stylesheet';
        l.href = 'https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css';
        document.head.appendChild(l);
      }
    })();
  })();
</script>
{% endblock %}
