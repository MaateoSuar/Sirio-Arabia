    {% extends 'layout.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h1 class="h4 mb-0">Registro de Venta / Pedido</h1>
  <div>
    <button class="btn btn-outline-primary" type="button" id="pending-open-btn">Pendientes</button>
  </div>
</div>
<!-- Modal Pendientes -->
<div class="modal fade" id="draftsModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Pendientes</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="table-responsive">
          <table class="table table-sm align-middle mb-0">
            <thead>
              <tr>
                <th>Cliente</th>
                <th>Empresa</th>
                <th class="text-end">Acciones</th>
              </tr>
            </thead>
            <tbody id="drafts-tbody">
              <tr><td colspan="3" class="text-center text-muted">Sin borradores</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cerrar</button>
      </div>
    </div>
  </div>
</div>
</div>
<div class="card mb-4">
  <div class="card-body">
    <div id="pedido-alert" class="alert alert-warning py-2 px-3 mb-3 d-none" role="alert" style="font-size:.9rem"></div>
    <form id="pedido-form" class="row g-2 g-md-3" method="post" action="{{ url_for('main.pedidos_create') }}" enctype="multipart/form-data">
      <div class="col-md-3">
        <label class="form-label">Fecha de compra</label>
        <input type="date" class="form-control" id="pedido_fecha" name="fecha_compra" value="{{ today }}">
      </div>
      <div class="col-md-3">
        <select class="form-select" id="pedido_cliente" name="client_id">
          <option value="">Cliente...</option>
          {% for c in clientes %}
            <option value="{{ c.id }}" data-razon="{{ c.apellido }}" data-nombre="{{ c.nombre }}">{{ c.apellido }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-3">
        <select class="form-select" id="pedido_branch" name="branch_id">
          <option value="">Sucursal del cliente...</option>
        </select>
      </div>
      <div class="col-md-3">
        <select class="form-select" id="pedido_empresa" name="company_id">
          <option value="">Empresa...</option>
          {% for e in empresas %}
            <option value="{{ e.id }}" data-mail="{{ e.mail_pedido or '' }}">{{ e.nombre }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-12">
        <input type="text" class="form-control" id="pedido_nota" name="nota" placeholder="Nota">
      </div>
      <div class="col-12">
        <textarea class="form-control" id="pedido_descripcion" name="descripcion" rows="6" placeholder="Descripción del pedido (puedes pegar texto desde WhatsApp)"></textarea>
      </div>
      <div class="col-12">
        <div class="d-flex justify-content-between align-items-center">
          <h6 class="mb-2">Pedidos anteriores del cliente en esta empresa</h6>
          <button class="btn btn-sm btn-outline-secondary" type="button" id="refresh-prev">Actualizar</button>
        </div>
        <div id="prev-orders" class="list-group small"></div>
      </div>
      <div class="col-12">
        <div class="d-flex gap-2 flex-wrap">
          <button class="btn btn-outline-secondary" type="button" id="preview-btn">Vista previa</button>
          <button class="btn btn-secondary" type="button" id="copy-preview-btn">Copiar borrador</button>
        </div>
        <textarea class="form-control mt-2" id="pedido_preview" rows="4" placeholder="Borrador del pedido"></textarea>
      </div>
      <div class="col-12">
        <div class="d-flex align-items-center justify-content-between">
          <label class="form-label m-0" style="color:#0f766e; font-weight:600">Destinatarios del pedido</label>
          <div class="d-flex gap-2">
            <input type="email" class="form-control form-control-sm" id="new_to_input" placeholder="Agregar mail" style="max-width:260px">
            <button class="btn btn-sm btn-outline-secondary" type="button" id="btnAddTo">Agregar</button>
          </div>
        </div>
        <div id="to-checklist" class="border rounded p-2 mt-2" style="max-height:200px; overflow:auto"></div>
        <div class="d-flex justify-content-end mt-2">
          <button type="button" id="btnConfirmarTo" class="btn btn-sm btn-primary">Confirmar selección</button>
        </div>
        <div class="mt-2">
          <div class="text-muted small" style="color:#0f766e !important; font-weight:600">Enviar a</div>
          <div id="to-selected" class="mt-1"></div>
        </div>
      </div>
      <div class="col-md-4">
        <input type="number" step="0.01" class="form-control" id="pedido_precio" name="precio_final" placeholder="Precio final (opcional)">
      </div>
      <div class="col-md-4">
        <select class="form-select" id="pedido_forma_pago" name="forma_pago" required>
          <option value="">Seleccione forma de pago</option>
          <option value="EFECTIVO">Efectivo</option>
          <option value="CHEQUE">Cheque</option>
          <option value="TRANSFERENCIA">Transferencia</option>
          <option value="NO_SE_SABE">No se sabe</option>
        </select>
      </div>
      <div class="col-12">
        <input type="file" name="attachments" id="pedido_attachments" class="form-control" multiple accept="image/*">
      </div>
      <div class="col-12 d-flex flex-wrap gap-2">
        <button class="btn btn-primary w-100 w-md-auto" type="button" id="gmail-draft-btn">Enviar pedido por mail</button>
        <button class="btn btn-outline-secondary w-100 w-md-auto" type="submit">Crear Pedido</button>
      </div>
    </form>
  </div>
</div>
<script>
  (function(){
    const clienteSel = document.getElementById('pedido_cliente');
    const empresaSel = document.getElementById('pedido_empresa');
    const mailInput = document.getElementById('pedido_mail_pedido');
    const notaInput = document.getElementById('pedido_nota');
    const descInput = document.getElementById('pedido_descripcion');
    const precioInput = document.getElementById('pedido_precio');
    const formaPagoSel = document.getElementById('pedido_forma_pago');
    const fechaInput = document.getElementById('pedido_fecha');
    const branchSel = document.getElementById('pedido_branch');
    const form = document.getElementById('pedido-form');
    const alertBox = document.getElementById('pedido-alert');
    const prevWrap = document.getElementById('prev-orders');
    const refreshPrevBtn = document.getElementById('refresh-prev');
    const previewBtn = document.getElementById('preview-btn');
    const copyPrevBtn = document.getElementById('copy-preview-btn');
    const previewTa = document.getElementById('pedido_preview');
    const draftsOpenBtn = document.getElementById('pending-open-btn');
    const draftsTbody = document.getElementById('drafts-tbody');
    // destinatarios
    const toBox = document.getElementById('to-checklist');
    const toList = document.getElementById('to-selected');
    const toAddBtn = document.getElementById('btnAddTo');
    const toInput = document.getElementById('new_to_input');
    let toConfirmed = new Set();
    // Guardar opciones completas de empresas por si se requiere restaurar (no usado actualmente)
    const empresaAllOptions = Array.from(empresaSel?.options || []);

    // Autorellenar mail pedido al seleccionar empresa leyendo data-mail del option seleccionado
    empresaSel?.addEventListener('change', ()=>{
      // Al cambiar empresa, limpiar campos y luego intentar cargar borrador del nuevo par
      clearFormForClientChange();
      const opt = empresaSel.options[empresaSel.selectedIndex];
      if (mailInput) mailInput.value = opt ? (opt.getAttribute('data-mail') || '') : '';
      loadPrevOrders();
      loadRecipientsFromCompany();
      // auto-cargar borrador del par actual
      const cid = clienteSel?.value; const eid = empresaSel?.value; if (cid && eid) { loadDraft(cid, eid); }
      saveDraft();
    });

    const gmailBtn = document.getElementById('gmail-draft-btn');
    gmailBtn?.addEventListener('click', function(){
      const empresaOpt = empresaSel.options[empresaSel.selectedIndex];
      // Union: confirmados + tildados actualmente
      let toSet = new Set(Array.from(toConfirmed));
      if (toBox) {
        toBox.querySelectorAll('.js-to-chk:checked').forEach(chk=>{
          const v = String(chk.value).trim(); if (v) toSet.add(v);
        });
      }
      let to = Array.from(toSet);
      if (!to.length) {
        const raw = (empresaOpt && empresaOpt.getAttribute('data-mail')) || '';
        to = raw.split(',').map(s=>s.trim()).filter(Boolean);
      }
      const clienteText = clienteSel.options[clienteSel.selectedIndex]?.getAttribute('data-razon') || clienteSel.options[clienteSel.selectedIndex]?.text || '';
      const empresaText = empresaOpt?.text || '';
      let titleTxt = `Pedido ${clienteText} - ${empresaText}`;
      const branchOpt = branchSel?.options[branchSel.selectedIndex];
      if (branchSel && branchSel.value && branchOpt) { titleTxt += ` / Sucursal: ${branchOpt.text}`; }
      const subject = encodeURIComponent(titleTxt);
      const body = encodeURIComponent(buildPreviewText());
      const url = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(to.join(','))}&su=${subject}&body=${body}`;
      window.open(url, '_blank');
    });

    // Load branches when client changes
    async function loadBranches(clientId){
      if(!branchSel) return;
      branchSel.innerHTML = '<option value="">Sucursal del cliente...</option>';
      if(!clientId) return;
      try{
        const res = await fetch(`/api/clientes/${clientId}/sucursales`);
        const items = await res.json();
        for(const b of items){
          const opt = document.createElement('option');
          opt.value = b.id;
          opt.textContent = b.label;
          branchSel.appendChild(opt);
        }
      }catch(e){/* noop */}
    }

    // Load companies linked to selected client
    async function loadCompanies(clientId){
      if(!empresaSel) return;
      empresaSel.innerHTML = '<option value="">Empresa...</option>';
      if (mailInput) mailInput.value = '';
      if(!clientId) return;
      try{
        const res = await fetch(`/api/clientes/${clientId}/empresas`);
        const items = await res.json();
        for(const e of items){
          const opt = document.createElement('option');
          opt.value = e.id;
          opt.textContent = e.label;
          opt.setAttribute('data-mail', e.mail_pedido || '');
          opt.setAttribute('data-mail-pago', e.mail_pago || '');
          empresaSel.appendChild(opt);
        }
      }catch(e){/* noop */}
    }
    clienteSel?.addEventListener('change', ()=>{
      const id = clienteSel.value;
      clearFormForClientChange();
      loadBranches(id);
      loadCompanies(id);
      loadPrevOrders();
      // limpiar destinatarios al cambiar cliente
      resetRecipients();
      saveDraft();
    });

    // Validación antes de enviar: evitar salir de la página con Bad Request
    form?.addEventListener('submit', function(e){
      const cid = (clienteSel && clienteSel.value) || '';
      const eid = (empresaSel && empresaSel.value) || '';
      let msg = '';
      if (!cid) msg = 'Debe seleccionar un cliente registrado.';
      else if (!eid) msg = 'Debe seleccionar una empresa vinculada al cliente.';
      if (msg) {
        e.preventDefault();
        if (alertBox) {
          alertBox.textContent = msg;
          alertBox.classList.remove('d-none');
        } else {
          alert(msg);
        }
        return false;
      }
      // ocultar alerta si todo ok
      if (alertBox) alertBox.classList.add('d-none');
      // eliminar borrador del par al crear pedido
      try{
        const cid = clienteSel?.value || '';
        const eid = empresaSel?.value || '';
        if (cid && eid) localStorage.removeItem(draftKey(cid, eid));
      }catch(err){}
    });

    function buildPreviewText(){
      const empresaOpt = empresaSel.options[empresaSel.selectedIndex];
      const clienteOpt = clienteSel.options[clienteSel.selectedIndex];
      const clienteText = clienteOpt?.getAttribute('data-razon') || clienteOpt?.text || '';
      const empresaText = empresaOpt?.text || '';
      const branchOpt2 = branchSel?.options[branchSel.selectedIndex];
      const nota = notaInput?.value || '';
      const desc = descInput?.value || '';
      let title = `Pedido ${clienteText} - ${empresaText}`;
      if (branchSel && branchSel.value && branchOpt2) { title += ` / Sucursal: ${branchOpt2.text}`; }
      const lines = [
        title,
        '',
        nota,
        '',
        desc
      ];
      return lines.join('\n');
    }

    // Guardado automático al escribir
    ;[notaInput, descInput, precioInput, formaPagoSel, branchSel, fechaInput].forEach(el=>{
      if (!el) return;
      el.addEventListener('input', saveDraft);
      el.addEventListener('change', saveDraft);
    });

    // Abrir modal de borradores
    draftsOpenBtn?.addEventListener('click', ()=>{
      populateDraftsModal();
      const modalEl = document.getElementById('draftsModal');
      const M = window.bootstrap && window.bootstrap.Modal; if (M) M.getOrCreateInstance(modalEl).show();
    });

    async function loadPrevOrders(){
      if(!prevWrap) return;
      prevWrap.innerHTML = '';
      const cid = clienteSel?.value; const eid = empresaSel?.value;
      if(!cid || !eid) return;
      try{
        const res = await fetch(`/api/pedidos/anteriores?client_id=${encodeURIComponent(cid)}&company_id=${encodeURIComponent(eid)}&limit=10`);
        const items = await res.json();
        if(!Array.isArray(items) || items.length===0){ prevWrap.innerHTML = '<div class="text-muted">Sin pedidos anteriores</div>'; return; }
        const fr = document.createDocumentFragment();
        items.forEach((o, idx)=>{
          const a = document.createElement('div');
          a.className = 'list-group-item d-flex justify-content-between align-items-start gap-2';
          const left = document.createElement('div');
          left.className = 'me-auto';
          const dt = o.created_at ? new Date(o.created_at) : null;
          const dtTxt = dt ? dt.toLocaleDateString() : '';
          const prev = (o.descripcion||'').split('\n').find(Boolean) || (o.nota||'');
          left.innerHTML = `<div class="fw-semibold">${dtTxt}</div><div class="text-muted">${prev}</div>`;
          const btns = document.createElement('div');
          const copyBtn = document.createElement('button');
          copyBtn.type = 'button';
          copyBtn.className = 'btn btn-sm btn-outline-primary';
          copyBtn.textContent = 'Copiar pedido';
          copyBtn.addEventListener('click', ()=>{
            notaInput.value = o.nota || '';
            descInput.value = o.descripcion || '';
            previewTa.value = buildPreviewText();
          });
          btns.appendChild(copyBtn);
          a.appendChild(left);
          a.appendChild(btns);
          fr.appendChild(a);
        });
        prevWrap.appendChild(fr);
      }catch(e){ prevWrap.innerHTML = '<div class="text-danger">Error al cargar</div>'; }
    }

    refreshPrevBtn?.addEventListener('click', loadPrevOrders);
    previewBtn?.addEventListener('click', ()=>{ previewTa.value = buildPreviewText(); });
    copyPrevBtn?.addEventListener('click', async ()=>{
      const txt = previewTa?.value || buildPreviewText();
      try{ await navigator.clipboard.writeText(txt); }catch(e){}
    });

    function resetRecipients(){
      toConfirmed = new Set();
      if (toBox) toBox.innerHTML = '';
      if (toList) toList.innerHTML = '<span class="text-muted">Ninguno</span>';
    }
    function renderRecipients(){
      if (!toList) return;
      if (toConfirmed.size === 0){
        toList.innerHTML = '<span class="text-muted">Ninguno</span>';
        return;
      }
      const chips = [];
      for (const em of toConfirmed){ chips.push(`<span class="badge bg-success text-white me-1 mb-1">${em}</span>`); }
      toList.innerHTML = chips.join('');
    }
    function addRecipientToChecklist(email){
      if (!toBox || !email) return;
      const id = 'to_' + btoa(email).replace(/=+/g,'');
      if (toBox.querySelector('#'+id)) return;
      const row = document.createElement('div'); row.className='form-check';
      const chk = document.createElement('input'); chk.type='checkbox'; chk.className='form-check-input js-to-chk'; chk.id=id; chk.value=email;
      const lbl = document.createElement('label'); lbl.className='form-check-label'; lbl.setAttribute('for', id); lbl.textContent=email;
      row.appendChild(chk); row.appendChild(lbl); toBox.appendChild(row);
    }
    function confirmRecipients(){
      if (!toBox) return;
      toBox.querySelectorAll('.js-to-chk:checked').forEach(chk=>{ const val = String(chk.value).trim(); if (val) toConfirmed.add(val); chk.checked=false; });
      renderRecipients();
    }
    function loadRecipientsFromCompany(){
      resetRecipients();
      const opt = empresaSel?.options[empresaSel.selectedIndex];
      const raw = opt ? (opt.getAttribute('data-mail') || '') : '';
      const pago = opt ? (opt.getAttribute('data-mail-pago') || '') : '';
      const merged = [raw, pago].filter(Boolean).join(',');
      if (!merged) { renderRecipients(); return; }
      merged.split(',').map(s=>s.trim()).filter(Boolean).forEach(addRecipientToChecklist);
      renderRecipients();
    }
    document.addEventListener('click', function(e){
      const t = e.target;
      if (t && t.id === 'btnConfirmarTo'){ e.preventDefault(); confirmRecipients(); }
      if (t && t.id === 'btnAddTo'){
        e.preventDefault(); const val = (toInput && toInput.value || '').trim(); if (val){ addRecipientToChecklist(val); toInput.value=''; }
      }
    });
  })();
</script>
{% endblock %}
