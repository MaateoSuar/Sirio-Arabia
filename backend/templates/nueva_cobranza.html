{% extends 'layout.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h1 class="h4 mb-0">Nueva cobranza</h1>
    <div class="text-muted small">Registrá pagos y/o notas de crédito para un pedido pendiente.</div>
  </div>
  <div class="d-flex gap-2">
    <a class="btn btn-outline-secondary" href="{{ url_for('main.cobranzas_pendientes') }}">Pendientes</a>
  </div>
</div>

<div class="card mb-3">
  <div class="card-body">
    <form method="post" action="{{ url_for('main.nueva_cobranza_create') }}" enctype="multipart/form-data" id="cobForm" autocomplete="off">
      <div class="row g-3">
        <div class="col-12 col-lg-4">
          <label class="form-label">Cliente</label>
          <select class="form-select" name="client_id" id="clientSelect" required>
            <option value="">Seleccionar...</option>
            {% for c in clientes %}
              <option value="{{ c.id }}">{{ c.apellido }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-12 col-lg-4">
          <label class="form-label">Empresa</label>
          <select class="form-select" name="company_id" id="companySelect" required>
            <option value="">Seleccionar...</option>
          </select>
        </div>

        <div class="col-12 col-lg-4">
          <label class="form-label">Pedido</label>
          <select class="form-select" name="order_id" id="orderSelect">
            <option value="">(Opcional) Seleccionar...</option>
          </select>
        </div>
      </div>

      <hr class="my-4">

      <div class="row g-3">
        <div class="col-12 col-lg-3">
          <label class="form-label">Fecha factura</label>
          <input class="form-control" id="orderCreatedAt" name="order_created_at" type="text" data-datepicker placeholder="DD/MM/AAAA">
        </div>
        <div class="col-12 col-lg-3">
          <label class="form-label">Entrega efectiva</label>
          <input class="form-control" id="orderEntrega" name="order_fecha_entrega_efectiva" type="text" data-datepicker placeholder="DD/MM/AAAA">
        </div>
        <div class="col-12 col-lg-3">
          <label class="form-label">Vencimiento</label>
          <input class="form-control" id="orderVenc" name="order_fecha_pago_estimada" type="text" data-datepicker placeholder="DD/MM/AAAA">
        </div>
        <div class="col-12 col-lg-3">
          <label class="form-label">Monto</label>
          <input class="form-control js-only-number" id="orderMonto" name="order_monto" type="text" inputmode="decimal" placeholder="0,00" autocomplete="off">
        </div>
        <div class="col-12 col-lg-3">
          <label class="form-label">Nota de crédito</label>
          <input class="form-control js-only-number" id="orderNc" name="order_credit_note" type="text" inputmode="decimal" placeholder="0,00" autocomplete="off">
        </div>
        <div class="col-12 col-lg-3">
          <label class="form-label">Retenciones</label>
          <input class="form-control js-only-number" id="orderRet" name="order_retenciones" type="text" inputmode="decimal" placeholder="0,00" autocomplete="off">
        </div>
        <div class="col-12 col-lg-3">
          <label class="form-label">Saldo histórico</label>
          <input class="form-control js-only-number" id="companySaldoInput" name="company_saldo_historico" type="text" inputmode="decimal" placeholder="-" autocomplete="off">
          <input type="hidden" id="companySaldoComputed" value="">
        </div>
        <div class="col-12">
          <label class="form-label">Nota / descripción</label>
          <textarea class="form-control" id="orderDesc" name="order_notes" rows="4"></textarea>
        </div>
      </div>

      <hr class="my-4">

      <div class="d-flex justify-content-between align-items-center mb-2">
        <h2 class="h6 mb-0">Medios de pago</h2>
      </div>

      <style>
        .pm-wrap{ display:grid; grid-template-columns: repeat(2, minmax(240px, 1fr)); gap:1rem; }
        @media (max-width: 991.98px){ .pm-wrap{ grid-template-columns: 1fr; } }
        .pm-card .form-control, .pm-card .form-select{ font-size:.95rem; }
        .pm-extras{ border: 1px dashed rgba(0,0,0,.15); border-radius: .5rem; padding: .5rem; background: rgba(0,0,0,.02); }
        .pm-extra-item{ border: 1px solid rgba(0,0,0,.10); border-radius: .5rem; padding: .5rem; background: #fff; }
        .pm-extra-row{ display:flex; align-items:end; gap:.5rem; flex-wrap:wrap; }
        .pm-extra-row .pm-col-amount{ width: 104px; min-width: 104px; }
        .pm-extra-row .pm-col-date{ width: 132px; min-width: 132px; }
        .pm-extra-row .pm-col-file{ width: 160px; min-width: 160px; }
        .pm-extra-row .pm-col-actions{ margin-left:auto; display:flex; gap:.4rem; flex-wrap:wrap; justify-content:flex-end; }
        .pm-extra-readonly input[type="file"]{ pointer-events:none; }
        @media (max-width: 575.98px){
          .pm-extra-row .pm-col-actions{ width: 100%; justify-content: flex-start; }
        }
      </style>

      <div class="pm-wrap">
        <div class="card pm-card">
          <div class="card-body">
            <div class="form-check mb-2">
              <input class="form-check-input pm-enable" type="checkbox" id="pmEfectivo" data-prefix="pm_efectivo">
              <label class="form-check-label" for="pmEfectivo">Efectivo</label>
            </div>
            <div class="row g-2">
              <div class="col-12">
                <label class="form-label mb-1">Monto</label>
                <input class="form-control js-only-number" name="pm_efectivo_amount" inputmode="decimal" placeholder="0,00" autocomplete="off" disabled>
              </div>
              <div class="col-12">
                <label class="form-label mb-1">Fecha</label>
                <input class="form-control" name="pm_efectivo_date" type="text" data-datepicker placeholder="DD-MM-AAAA" autocomplete="off" disabled>
              </div>
            </div>
            <div class="pm-extras mt-2" data-prefix="pm_efectivo">
              <div class="d-flex justify-content-between align-items-center">
                <div class="small text-muted">Agregados</div>
                <button type="button" class="btn btn-sm btn-outline-secondary pm-add" data-prefix="pm_efectivo" disabled>Agregar</button>
              </div>
              <div class="pm-extras-list mt-2"></div>
            </div>
          </div>
        </div>

        <div class="card pm-card">
          <div class="card-body">
            <div class="form-check mb-2">
              <input class="form-check-input pm-enable" type="checkbox" id="pmTransf" data-prefix="pm_transferencia">
              <label class="form-check-label" for="pmTransf">Transferencia</label>
            </div>
            <div class="row g-2">
              <div class="col-12">
                <label class="form-label mb-1">Monto</label>
                <input class="form-control js-only-number" name="pm_transferencia_amount" inputmode="decimal" placeholder="0,00" autocomplete="off" disabled>
              </div>
              <div class="col-12">
                <label class="form-label mb-1">Fecha</label>
                <input class="form-control" name="pm_transferencia_date" type="text" data-datepicker placeholder="DD-MM-AAAA" autocomplete="off" disabled>
              </div>
              <div class="col-12">
                <label class="form-label mb-1">Adjunto</label>
                <input class="form-control" type="file" name="pm_transferencia_attachment" disabled>
              </div>
            </div>
            <div class="pm-extras mt-2" data-prefix="pm_transferencia">
              <div class="d-flex justify-content-between align-items-center">
                <div class="small text-muted">Agregados</div>
                <button type="button" class="btn btn-sm btn-outline-secondary pm-add" data-prefix="pm_transferencia" disabled>Agregar</button>
              </div>
              <div class="pm-extras-list mt-2"></div>
            </div>
          </div>
        </div>

        <div class="card pm-card">
          <div class="card-body">
            <div class="form-check mb-2">
              <input class="form-check-input pm-enable" type="checkbox" id="pmEcheq" data-prefix="pm_echeq">
              <label class="form-check-label" for="pmEcheq">E-cheq</label>
            </div>
            <div class="row g-2">
              <div class="col-12">
                <label class="form-label mb-1">Monto</label>
                <input class="form-control js-only-number" name="pm_echeq_amount" inputmode="decimal" placeholder="0,00" autocomplete="off" disabled>
              </div>
              <div class="col-12">
                <label class="form-label mb-1">Fecha</label>
                <input class="form-control" name="pm_echeq_date" type="text" data-datepicker placeholder="DD-MM-AAAA" autocomplete="off" disabled>
              </div>
              <div class="col-12">
                <label class="form-label mb-1">Adjunto</label>
                <input class="form-control" type="file" name="pm_echeq_attachment" disabled>
              </div>
            </div>
            <div class="pm-extras mt-2" data-prefix="pm_echeq">
              <div class="d-flex justify-content-between align-items-center">
                <div class="small text-muted">Agregados</div>
                <button type="button" class="btn btn-sm btn-outline-secondary pm-add" data-prefix="pm_echeq" disabled>Agregar</button>
              </div>
              <div class="pm-extras-list mt-2"></div>
            </div>
          </div>
        </div>

        <div class="card pm-card">
          <div class="card-body">
            <div class="form-check mb-2">
              <input class="form-check-input pm-enable" type="checkbox" id="pmChqTerc" data-prefix="pm_cheque_terceros">
              <label class="form-check-label" for="pmChqTerc">Cheque físico terceros</label>
            </div>
            <div class="row g-2">
              <div class="col-12">
                <label class="form-label mb-1">Monto</label>
                <input class="form-control js-only-number" name="pm_cheque_terceros_amount" inputmode="decimal" placeholder="0,00" autocomplete="off" disabled>
              </div>
              <div class="col-12">
                <label class="form-label mb-1">Fecha</label>
                <input class="form-control" name="pm_cheque_terceros_date" type="text" data-datepicker placeholder="DD-MM-AAAA" autocomplete="off" disabled>
              </div>
              <div class="col-12">
                <label class="form-label mb-1">Imagen (opcional)</label>
                <input class="form-control" type="file" name="pm_cheque_terceros_attachment" accept=".pdf,image/*" autocomplete="off" disabled>
              </div>
            </div>
            <div class="pm-extras mt-2" data-prefix="pm_cheque_terceros">
              <div class="d-flex justify-content-between align-items-center">
                <div class="small text-muted">Agregados</div>
                <button type="button" class="btn btn-sm btn-outline-secondary pm-add" data-prefix="pm_cheque_terceros" disabled>Agregar</button>
              </div>
              <div class="pm-extras-list mt-2"></div>
            </div>
          </div>
        </div>

        <div class="card pm-card">
          <div class="card-body">
            <div class="form-check mb-2">
              <input class="form-check-input pm-enable" type="checkbox" id="pmChqProp" data-prefix="pm_cheque_propio">
              <label class="form-check-label" for="pmChqProp">Cheque físico propio</label>
            </div>
            <div class="row g-2">
              <div class="col-12">
                <label class="form-label mb-1">Monto</label>
                <input class="form-control js-only-number" name="pm_cheque_propio_amount" inputmode="decimal" placeholder="0,00" autocomplete="off" disabled>
              </div>
              <div class="col-12">
                <label class="form-label mb-1">Fecha</label>
                <input class="form-control" name="pm_cheque_propio_date" type="text" data-datepicker placeholder="DD-MM-AAAA" autocomplete="off" disabled>
              </div>
              <div class="col-12">
                <label class="form-label mb-1">Imagen (opcional)</label>
                <input class="form-control" type="file" name="pm_cheque_propio_attachment" accept=".pdf,image/*" autocomplete="off" disabled>
              </div>
            </div>
            <div class="pm-extras mt-2" data-prefix="pm_cheque_propio">
              <div class="d-flex justify-content-between align-items-center">
                <div class="small text-muted">Agregados</div>
                <button type="button" class="btn btn-sm btn-outline-secondary pm-add" data-prefix="pm_cheque_propio" disabled>Agregar</button>
              </div>
              <div class="pm-extras-list mt-2"></div>
            </div>
          </div>
        </div>
      </div>

      <div id="cobResumen" class="alert alert-info mt-3 mb-0 d-none" role="alert"></div>

      <div class="card mt-3">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <div class="fw-semibold">Borrador</div>
            <button type="button" class="btn btn-sm btn-outline-secondary" id="btnCopyBorrador">Copiar</button>
          </div>
          <textarea class="form-control" id="borradorTxt" rows="10" readonly></textarea>
        </div>
      </div>

      <div class="modal fade" id="overpayModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header border-0 pb-0">
              <h5 class="modal-title">Confirmar excedente</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
              <p class="mb-0" id="overpayModalMsg"></p>
            </div>
            <div class="modal-footer border-0 pt-0">
              <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
              <button type="button" class="btn btn-primary" id="overpayModalConfirmBtn">Confirmar</button>
            </div>
          </div>
        </div>
      </div>

      <input type="hidden" name="draft" id="draftFlag" value="0">
      <input type="hidden" name="confirm_overpay" id="confirmOverpay" value="0">
      <input type="hidden" name="order_id_override" id="orderIdOverride" value="">
      <input type="hidden" name="draft_id" id="draftId" value="">

      <div class="d-flex justify-content-end gap-2 mt-3">
        <a class="btn btn-light" href="{{ url_for('main.deudas_pendientes') }}">Cancelar</a>
        <button class="btn btn-outline-secondary" type="button" id="btnSaveDraft">Guardar borrador</button>
        <button class="btn btn-primary" type="submit">Guardar cobranza</button>
      </div>
    </form>
  </div>
</div>

{% if draft_data %}
<script id="draftData" type="application/json">{{ draft_data|tojson }}</script>
{% endif %}

<script>
(function(){
  var draft = null;
  try {
    var el = document.getElementById('draftData');
    if (el && el.textContent) {
      draft = JSON.parse(el.textContent);
    }
  } catch(e) {
    draft = null;
  }

  function ensureFlatpickrLoaded(cb){
    try {
      if (window.flatpickr) {
        cb && cb();
        return;
      }
      var cssId = 'flatpickr-css';
      if (!document.getElementById(cssId)) {
        var link = document.createElement('link');
        link.id = cssId;
        link.rel = 'stylesheet';
        link.href = 'https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css';
        document.head.appendChild(link);
      }
      var script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/flatpickr';
      script.onload = function(){ cb && cb(); };
      document.head.appendChild(script);
    } catch(e) {
      cb && cb();
    }
  }

  function initDatepicker(inp){
    try {
      if (!inp) return;
      if (!window.flatpickr) return;
      if (inp._flatpickr) return;
      window.flatpickr(inp, {
        dateFormat: 'Y-m-d',
        altInput: true,
        altFormat: 'd/m/Y',
        allowInput: true
      });
    } catch(e) {}
  }

  function _saveSaldoHistorico(){
    var clientId = (clientSel && clientSel.value) ? String(clientSel.value) : '';
    var companyId = (companySel && companySel.value) ? String(companySel.value) : '';
    var saldoInp = null;
    var saldoComputed = null;
    try { saldoInp = document.getElementById('companySaldoInput'); } catch(e0) { saldoInp = null; }
    try { saldoComputed = document.getElementById('companySaldoComputed'); } catch(e1) { saldoComputed = null; }
    if (!clientId || !companyId || !saldoInp) return;
    var desired = parseMoney(saldoInp.value);
    var computed = parseMoney(saldoComputed && saldoComputed.value);
    try {
      var fd = new FormData();
      fd.append('client_id', clientId);
      fd.append('company_id', companyId);
      fd.append('desired_total', String(desired));
      fd.append('computed_total', String(computed));
      fetch('/api/cobranzas/saldo_historico', { method: 'POST', body: fd, credentials: 'same-origin' })
        .then(function(r){ return r.json(); })
        .then(function(){
          try { if (orderMonto) orderMonto.dataset.companyDiffTotal = String(desired); } catch(e2) {}
          updateResumen();
        })
        .catch(function(){});
    } catch(e) {}
  }

  function fmtDateDMY(iso){
    try{
      const s = String(iso || '').trim();
      if (!s) return '';
      const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (!m) return s;
      return `${m[3]}/${m[2]}/${m[1]}`;
    }catch(e){
      return String(iso || '');
    }
  }

  function setDateValue(inp, iso){
    try {
      if (!inp) return;
      if (inp._flatpickr) {
        inp._flatpickr.setDate(iso || '', true, 'Y-m-d');
      } else {
        inp.value = iso || '';
      }
    } catch(e) {
      try { inp.value = iso || ''; } catch(_) {}
    }
  }

  function fmtMoney(x){
    try {
      const n = Number(x || 0);
      return n.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    } catch(e){
      return String(x || '');
    }
  }

  function setMoneyInputValue(inp, raw){
    try {
      if (!inp) return;
      if (raw == null || raw === '') { inp.value = ''; return; }
      var n = Number(raw);
      if (!isNaN(n) && Math.abs(n) < 0.0000001) { inp.value = ''; return; }
      inp.value = fmtMoney(parseMoney(raw));
    } catch(e){
      try { inp.value = String(raw || ''); } catch(_) {}
    }
  }

  function parseMoney(v){
    try{
      var s = String(v || '').trim();
      if (!s) return 0;
      s = s.replace(/\s+/g,'');
      // soportar: 1234.56 / 1234,56 / 1.234,56
      if (s.indexOf(',') !== -1 && s.indexOf('.') !== -1) {
        s = s.replace(/\./g,'').replace(',', '.');
      } else if (s.indexOf(',') !== -1) {
        s = s.replace(',', '.');
      } else if (s.indexOf('.') !== -1) {
        // Si hay puntos y NO hay coma: puede ser miles (2.300 / 1.245.340)
        try {
          var parts = s.split('.');
          var allDigits = parts.every(function(p){ return /^\d+$/.test(p); });
          var last = parts[parts.length - 1] || '';
          if (allDigits && (parts.length > 2 || last.length === 3)) {
            s = parts.join('');
          }
        } catch(e0) {}
      }
      s = s.replace(/[^0-9.\-]/g,'');
      var n = Number(s);
      return isNaN(n) ? 0 : n;
    }catch(e){
      return 0;
    }
  }

  const clientSel = document.getElementById('clientSelect');
  const companySel = document.getElementById('companySelect');
  const orderSel = document.getElementById('orderSelect');

  try {
    if (form) {
      form.setAttribute('autocomplete', 'off');
    }
  } catch(_) {}

  // Si el usuario vuelve a esta pantalla con el botón "Atrás", el navegador puede restaurar inputs (BFCache)
  // y re-enviar montos viejos al guardar, duplicando pagos. Forzar reset al volver.
  try {
    window.addEventListener('pageshow', function(ev){
      try {
        if (ev && ev.persisted) {
          resetMovements();
          clearHistoricalPayments();
        }
      } catch(_) {}
    });
  } catch(_) {}

  const orderCreatedAt = document.getElementById('orderCreatedAt');
  const orderEntrega = document.getElementById('orderEntrega');
  const orderVenc = document.getElementById('orderVenc');
  const orderMonto = document.getElementById('orderMonto');
  const orderNc = document.getElementById('orderNc');
  const orderRet = document.getElementById('orderRet');
  const orderDesc = document.getElementById('orderDesc');

  try {
    var saldoInp2 = document.getElementById('companySaldoInput');
    if (saldoInp2) {
      saldoInp2.addEventListener('input', function(){ try { formatMoneyLive(saldoInp2); } catch(_) {} updateResumen(); });
      saldoInp2.addEventListener('change', function(){ _saveSaldoHistorico(); });
      saldoInp2.addEventListener('blur', function(){ _saveSaldoHistorico(); });
    }
  } catch(_) {}

  const pmEnables = document.querySelectorAll('.pm-enable');
  const pmCfg = {
    pm_efectivo: { method: 'EFECTIVO', attach: false },
    pm_transferencia: { method: 'TRANSFERENCIA', attach: true },
    pm_echeq: { method: 'E-CHEQ', attach: true },
    pm_cheque_terceros: { method: 'CHEQUE_TERCEROS', attach: true },
    pm_cheque_propio: { method: 'CHEQUE_PROPIO', attach: true }
  };

  function methodToPrefix(method){
    method = String(method || '').trim().toUpperCase();
    method = method.replace(/[-\s]+/g, '_');
    var found = null;
    try {
      Object.keys(pmCfg).forEach(function(prefix){
        try {
          var m = String(pmCfg[prefix] && pmCfg[prefix].method ? pmCfg[prefix].method : '').trim().toUpperCase();
          m = m.replace(/[-\s]+/g, '_');
          if (m === method) found = prefix;
        } catch(e0) {}
      });
    } catch(e) {}
    return found;
  }

  function extrasWrap(prefix){
    try { return document.querySelector('.pm-extras[data-prefix="' + prefix + '"]'); } catch(e) { return null; }
  }
  function extrasList(prefix){
    var w = extrasWrap(prefix);
    if (!w) return null;
    return w.querySelector('.pm-extras-list');
  }
  function setExtrasEnabled(prefix, enabled){
    var w = extrasWrap(prefix);
    if (!w) return;
    try {
      w.querySelectorAll('button.pm-add').forEach(function(btn){ btn.disabled = !enabled; });
    } catch(e) {}
    try {
      w.querySelectorAll('input,button').forEach(function(el){
        if (el.classList && el.classList.contains('pm-add')) return;
        if (el.classList && el.classList.contains('pm-remove')) return;
        if (el.tagName === 'BUTTON') return;
        try {
          var hist = el.closest && el.closest('.pm-extra-item[data-historical="1"]');
          if (hist) {
            el.disabled = true;
            return;
          }
        } catch(_) {}
        el.disabled = !enabled;
      });
    } catch(e) {}
  }

  function clearFixedPmInputs(prefix){
    try {
      var a = document.querySelector('[name="' + String(prefix) + '_amount"]');
      if (a) a.value = '';
    } catch(_) {}
    try {
      var d = document.querySelector('[name="' + String(prefix) + '_date"]');
      if (d) d.value = '';
      if (d && d._flatpickr) {
        try { d._flatpickr.setDate('', true); } catch(e0) {}
      }
    } catch(_) {}
    try {
      var n = document.querySelector('[name="' + String(prefix) + '_notes"]');
      if (n) n.value = '';
    } catch(_) {}
    try {
      var f = document.querySelector('[name="' + String(prefix) + '_attachment"]');
      if (f) {
        try { f.value = ''; } catch(e1) {}
      }
    } catch(_) {}
  }

  var _histPaymentsReqId = 0;
  function loadHistoricalPayments(orderIdVal){
    _histPaymentsReqId = (_histPaymentsReqId || 0) + 1;
    var reqId = _histPaymentsReqId;
    clearHistoricalPayments();
    if (!orderIdVal) return;
    fetch(`/api/cobranzas/pagos_por_pedido?order_id=${encodeURIComponent(orderIdVal)}`)
      .then(r => {
        if (!r || !r.ok) throw new Error('HTTP_' + (r ? r.status : '0'));
        return r.json();
      })
      .then(rows => {
        if (reqId !== _histPaymentsReqId) return;
        clearHistoricalPayments();
        var added = 0;
        var receivedMethods = [];
        var basePaidNew = 0;
        var baseCreditNew = 0;
        (rows || []).forEach(function(p){
          try {
            var kind = String(p && p.kind ? p.kind : '').trim().toUpperCase();
            if (kind === 'DRAFT') return;
            var isVoided = false;
            try { isVoided = !!(p && p.voided_at); } catch(_) { isVoided = false; }
            if (isVoided) return;

            var methodRaw = '';
            try { methodRaw = String(p && p.method ? p.method : '').trim(); } catch(e_m) { methodRaw = ''; }
            if (methodRaw) {
              try { receivedMethods.push(methodRaw); } catch(_) {}
            }

            try {
              var amtN = Number(p && p.amount != null ? p.amount : 0);
              if (isNaN(amtN)) amtN = 0;
              if (kind === 'PAYMENT') {
                var m2 = String(methodRaw || '').trim().toUpperCase();
                if (m2 && (m2 === 'NC' || m2 === 'RETENCION')) {
                  // no-op
                } else {
                  basePaidNew += Math.abs(amtN);
                }
              }
              if (kind === 'CREDIT_NOTE' || String(methodRaw || '').trim().toUpperCase() === 'NC') {
                baseCreditNew += Math.abs(amtN);
              }
            } catch(_) {}

            if (!methodRaw) return;

            var prefix = methodToPrefix(methodRaw);
            if (!prefix) return;

            // No auto-habilitar el medio de pago por tener historial.
            // Si el navegador autocompleta inputs, y nosotros habilitamos el checkbox automáticamente,
            // esos valores se vuelven a enviar al guardar y se duplican pagos.
            // El historial se muestra siempre; para cargar un pago nuevo el usuario debe tildar el checkbox.
            try { clearFixedPmInputs(prefix); } catch(_) {}

            addHistoricalPayment(prefix, p);
            added++;
          } catch(e0) {}
        });

        try {
          if (orderMonto && orderMonto.dataset) {
            orderMonto.dataset.basePaid = String(basePaidNew || 0);
            orderMonto.dataset.baseCredit = String(baseCreditNew || 0);
            var basePedido = parseMoney(orderMonto.dataset.basePedido || orderMonto.value || '0');
            var rem = Number(basePedido || 0) - Number(basePaidNew || 0) - Number(baseCreditNew || 0);
            orderMonto.dataset.baseRemaining = String(rem || 0);
          }
        } catch(_) {}

        try { updateBorrador(); } catch(e_b0) {}
        try { updateResumen(); } catch(e_b1) {}

        try {
          if ((rows || []).length === 0) {
            if (window.showToast) window.showToast('Este pedido no tiene pagos previos guardados.', 'info');
          } else if (added === 0) {
            var uniq = [];
            try {
              (receivedMethods || []).map(function(x){ return String(x || ''); }).forEach(function(m){
                m = m.trim();
                if (!m) return;
                if (uniq.indexOf(m) === -1) uniq.push(m);
              });
            } catch(eu) {}
            if (window.showToast) window.showToast('Se encontraron pagos previos pero no se pudieron mostrar. Métodos: ' + (uniq.join(', ') || '-'), 'warning');
          }
        } catch(e2) {}
      })
      .catch((e) => {
        if (reqId !== _histPaymentsReqId) return;
        try {
          if (window.showToast) window.showToast('No se pudieron cargar los pagos previos del pedido. Reintentá o refrescá la página.', 'warning');
        } catch(_) {}
      });
  }

  function sanitizeNumericInput(el){
    if (!el) return;
    try{
      var v = String(el.value || '');
      // permitir dígitos + separadores decimal/miles
      v = v.replace(/[^0-9.,]/g, '');
      el.value = v;
    }catch(e){}
  }

  function onlyDigits(v){ return (v||'').replace(/\D+/g,''); }

  function setCaretByDigitIndex(formattedValue, digitIndex){
    if (digitIndex <= 0) return 0;
    var count = 0;
    for (var i = 0; i < formattedValue.length; i++) {
      if (/\d/.test(formattedValue.charAt(i))) {
        count++;
        if (count >= digitIndex) return i + 1;
      }
    }
    return formattedValue.length;
  }

  function fmtThousandsInt(intDigits){
    if (!intDigits) return '';
    intDigits = String(intDigits).replace(/^0+(?!$)/,'');
    return intDigits.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }

  function formatMoneyLive(el){
    if (!el) return;
    var sel = (typeof el.selectionStart === 'number') ? el.selectionStart : null;
    var digitsBefore = null;
    if (sel != null) {
      try { digitsBefore = onlyDigits((el.value || '').slice(0, sel)).length; } catch(e) { digitsBefore = null; }
    }

    var v = String(el.value || '');
    // Sanear: permitir solo dígitos + '.' + ','
    v = v.replace(/[^0-9.,]/g, '');

    // Usar ',' como separador decimal (máx 2). Ignorar '.' ingresados (miles).
    var hasComma = v.indexOf(',') !== -1;
    var parts = v.split(',');
    var intPart = onlyDigits(parts[0] || '');
    var decPart = hasComma ? onlyDigits((parts[1] || '')).slice(0, 2) : '';
    var formatted = fmtThousandsInt(intPart);
    if (hasComma) {
      formatted += ',' + decPart;
      // permitir coma sola mientras el usuario la escribe
      if (!decPart && /,$/.test(v)) {
        formatted = fmtThousandsInt(intPart) + ',';
      }
    }

    if (formatted === el.value) return;
    el.value = formatted;
    if (digitsBefore != null) {
      var caret = setCaretByDigitIndex(formatted, digitsBefore);
      try { el.setSelectionRange(caret, caret); } catch(e) {}
    }
  }

  function updateResumen(){
    var box = document.getElementById('cobResumen');
    if (!box) return;
    var saldoInp = null;
    try { saldoInp = document.getElementById('companySaldoInput'); } catch(eh) { saldoInp = null; }
    var totalPedido = parseMoney(orderMonto && orderMonto.value);
    var totalPagos = 0;
    try{
      document.querySelectorAll('[name$="_amount"]:not([disabled]), [name="row_amount"]:not([disabled])').forEach(function(inp){
        totalPagos += Math.abs(parseMoney(inp.value));
      });
    }catch(e){}

    var nowNc = 0;
    var nowRet = 0;
    try { nowNc = Math.abs(parseMoney(orderNc && orderNc.value)); } catch(e) { nowNc = 0; }
    try { nowRet = Math.abs(parseMoney(orderRet && orderRet.value)); } catch(e) { nowRet = 0; }

    // Si el pedido ya tenía pagos/NC previas, mostrar saldo real antes/después
    var basePedido = 0;
    var basePaid = 0;
    var baseCredit = 0;
    var baseRemaining = null;
    var compTotal = null;
    var compDiff = null;
    try {
      basePedido = parseMoney(orderMonto && (orderMonto.dataset.basePedido || orderMonto.value));
      basePaid = parseMoney(orderMonto && (orderMonto.dataset.basePaid || '0'));
      baseCredit = parseMoney(orderMonto && (orderMonto.dataset.baseCredit || '0'));
      baseRemaining = parseMoney(orderMonto && (orderMonto.dataset.baseRemaining || '0'));
      compTotal = parseMoney(orderMonto && (orderMonto.dataset.companyRemainingTotal || '0'));
      compDiff = parseMoney(orderMonto && (orderMonto.dataset.companyDiffTotal || (saldoInp ? saldoInp.value : '0') || '0'));
    } catch(e) {
      basePedido = totalPedido;
      basePaid = 0;
      baseCredit = 0;
      baseRemaining = null;
      compTotal = null;
      compDiff = null;
    }

    // Diferencias de otros pedidos YA cobrados (saldo a favor/en contra histórico)
    var companyAdj = 0;
    try {
      companyAdj = Number(compDiff || 0);
      if (isNaN(companyAdj)) companyAdj = 0;
    } catch(ea) { companyAdj = 0; }

    // Lógica:
    // Deuda neta = Factura - (NC previas + NC ahora) - Retenciones
    // Pendiente final = Deuda neta - (Pagos previos + Pagos ahora)
    // Deuda neta del pedido ajustada por saldo previo del cliente-empresa (otros pedidos)
    var deudaNeta = (basePedido || totalPedido) - baseCredit - nowNc - nowRet + companyAdj;
    var pendienteFinal = deudaNeta - basePaid - totalPagos;

    // si no hay nada seleccionado/cargado, ocultar
    if (!totalPedido && !totalPagos && !nowNc && !nowRet && !basePaid && !baseCredit && !(companyAdj && Math.abs(companyAdj) > 0.009)){
      box.classList.add('d-none');
      box.textContent = '';
      return;
    }

    function pushPart(arr, label, val){
      try {
        if (val == null) return;
        var n = Number(val);
        if (isNaN(n)) return;
        if (Math.abs(n) <= 0.009) return;
        arr.push(label + ': $ ' + fmtMoney(n));
      } catch(e) {}
    }

    var headerPedido = (basePedido || totalPedido);
    var parts = [];
    parts.push('Pedido: $ ' + fmtMoney(headerPedido));
    try {
      if (companyAdj < -0.009) parts.push('Saldo previo a favor: $ ' + fmtMoney(Math.abs(companyAdj)));
      else if (companyAdj > 0.009) parts.push('Saldo previo pendiente: $ ' + fmtMoney(companyAdj));
    } catch(eax) {}
    pushPart(parts, 'Ya pagado', basePaid);
    pushPart(parts, 'NC previas', baseCredit);
    pushPart(parts, 'Pagos ahora', totalPagos);
    pushPart(parts, 'Retenciones', nowRet);
    pushPart(parts, 'NC ahora', nowNc);
    pushPart(parts, 'Deuda neta', deudaNeta);
    var txt = parts.join(' | ');
    if (pendienteFinal > 0.009) {
      box.className = 'alert alert-warning mt-3 mb-0';
      txt += ' | Pendiente: $ ' + fmtMoney(pendienteFinal);
    } else if (pendienteFinal < -0.009) {
      box.className = 'alert alert-info mt-3 mb-0';
      txt += ' | Excedente: $ ' + fmtMoney(Math.abs(pendienteFinal));
    } else {
      box.className = 'alert alert-success mt-3 mb-0';
      txt += ' | OK: Cierra el total';
    }

    try {
      if (saldoInp) {
        try {
          saldoInp.classList.remove('text-success');
          saldoInp.classList.remove('text-danger');
        } catch(e0) {}
        if (!(companySel && companySel.value)) {
          // no-op
        } else if (companyAdj > 0.009) {
          try { saldoInp.classList.add('text-danger'); } catch(e1) {}
        } else if (companyAdj < -0.009) {
          try { saldoInp.classList.add('text-success'); } catch(e2) {}
        }
      }
    } catch(e) {}

    box.textContent = txt;
    box.classList.remove('d-none');
  }

  function applyPmEnabled(prefix, enabled, requiresAttach){
    try {
      const fields = document.querySelectorAll(`[name^="${prefix}_"]`);
      fields.forEach(inp => {
        inp.disabled = !enabled;
        // flatpickr crea un input visible (altInput) distinto; mantenerlo sincronizado
        try {
          if (inp._flatpickr && inp._flatpickr.altInput) {
            inp._flatpickr.altInput.disabled = !enabled;
          }
        } catch(e) {}
        if (!enabled) {
          try { inp.required = false; } catch(e) {}
          if (inp.type === 'file') {
            try { inp.value = ''; } catch(e) {}
          } else {
            inp.value = '';
          }
        }
      });

      // Default fecha: hoy al habilitar (solo si está vacía)
      if (enabled) {
        try {
          const today = new Date();
          const y = today.getFullYear();
          const m = String(today.getMonth() + 1).padStart(2, '0');
          const d = String(today.getDate()).padStart(2, '0');
          const iso = `${y}-${m}-${d}`;
          const dateInp = document.querySelector(`[name="${prefix}_date"][data-datepicker]`);
          if (dateInp && !String(dateInp.value || '').trim()) {
            // asegurar flatpickr
            try { initDatepicker(dateInp); } catch(e) {}
            setDateValue(dateInp, iso);
            // si existe altInput, habilitarlo
            try {
              if (dateInp._flatpickr && dateInp._flatpickr.altInput) {
                dateInp._flatpickr.altInput.disabled = false;
              }
            } catch(e) {}
          }
        } catch(e) {}
      }
      if (enabled && requiresAttach) {
        const f = document.querySelector(`[name="${prefix}_attachment"]`);
        if (f) {
          try { f.required = true; } catch(e) {}
        }
      }
      ensureFlatpickrLoaded(function(){
        try { document.querySelectorAll(`[name^="${prefix}_"][data-datepicker]`).forEach(initDatepicker); } catch(e) {}
      });
    } catch(e) {}
  }

      }
      try { form._isDraftSubmit = false; } catch(e_d1) {}
      try { if (confirmOverpay) confirmOverpay.value = '0'; } catch(e) {}
      updateResumen();

      // Si queda saldo a favor (excedente), pedir confirmación antes de guardar (solo si NO es borrador)
      try {
        if (draftFlag.value === '1') return;
        // Usar el monto ACTUAL del input; dataset.basePedido puede estar desactualizado si el usuario lo editó.
        var basePedido = parseMoney(orderMonto && (orderMonto.value || orderMonto.dataset.basePedido || '0'));
        var basePaid = parseMoney(orderMonto && (orderMonto.dataset.basePaid || '0'));
        var baseCredit = parseMoney(orderMonto && (orderMonto.dataset.baseCredit || '0'));
        var compDiff = parseMoney(orderMonto && (orderMonto.dataset.companyDiffTotal || '0'));
        var companyAdj = 0;
        try {
          companyAdj = Number(compDiff || 0);
          if (isNaN(companyAdj)) companyAdj = 0;
        } catch(ea) { companyAdj = 0; }
        var totalPagos = 0;
        document.querySelectorAll('[name$="_amount"]:not([disabled]), [name="row_amount"]:not([disabled])').forEach(function(inp){ totalPagos += Math.abs(parseMoney(inp.value)); });
        var nowNc = Math.abs(parseMoney(orderNc && orderNc.value));
        var nowRet = Math.abs(parseMoney(orderRet && orderRet.value));
        var deudaNeta = basePedido - baseCredit - nowNc - nowRet + companyAdj;
        var pendienteFinal = deudaNeta - basePaid - totalPagos;
        if (pendienteFinal < -0.009) {
          ev.preventDefault();
          try {
            var msg = document.getElementById('overpayModalMsg');
            if (msg) msg.textContent = 'Hay saldo a favor (excedente) de $ ' + fmtMoney(Math.abs(pendienteFinal)) + '. ¿Querés guardar igual?';
            var modalEl = document.getElementById('overpayModal');
            var btn = document.getElementById('overpayModalConfirmBtn');
            if (!modalEl || !btn || !(window.bootstrap && window.bootstrap.Modal)) {
              // fallback
              if (window.showToast) window.showToast('Hay excedente. Confirmá para guardar.', 'warning');
              return;
            }
            if (form._overpayBound !== true) {
              btn.addEventListener('click', function(){
                try { if (confirmOverpay) confirmOverpay.value = '1'; } catch(e0) {}
                try {
                  var inst = window.bootstrap.Modal.getInstance(modalEl);
                  if (inst) inst.hide();
                } catch(e1) {}
                try { form._skipOverpayConfirm = true; } catch(e2) {}
                form.submit();
              });
              form._overpayBound = true;
            }
            var bsModal = window.bootstrap.Modal.getOrCreateInstance(modalEl);
            bsModal.show();
          } catch(e5) {}
          return;
        }
      } catch(e) {}
    });
  }

  resetMovements();
  ensureFlatpickrLoaded(function(){
    try { document.querySelectorAll('[data-datepicker]').forEach(initDatepicker); } catch(e) {}
  });
  updateResumen();

  // Precargar borrador si viene desde /cobranzas/pendientes
  try {
    function waitUntil(condFn, timeoutMs){
      timeoutMs = timeoutMs || 6000;
      return new Promise(function(resolve){
        var start = Date.now();
        var t = setInterval(function(){
          var ok = false;
          try { ok = !!condFn(); } catch(e) { ok = false; }
          if (ok) {
            clearInterval(t);
            resolve(true);
            return;
          }
          if ((Date.now() - start) > timeoutMs) {
            clearInterval(t);
            resolve(false);
          }
        }, 80);
      });
    }

    if (draft && draft.client_id && clientSel) {
      clientSel.value = String(draft.client_id);
      setCompanies(String(draft.client_id));
      waitUntil(function(){
        try {
          if (!draft.company_id || !companySel) return false;
          return Array.from(companySel.options || []).some(function(o){ return String(o.value) === String(draft.company_id); });
        } catch(e){ return false; }
      }, 8000).then(function(){
        try {
          if (draft.company_id && companySel) {
            companySel.value = String(draft.company_id);
            setPendingOrders(String(draft.client_id), String(draft.company_id));
          }
        } catch(e2) {}
        return waitUntil(function(){
          try {
            if (!draft.order_id || !orderSel) return false;
            return Array.from(orderSel.options || []).some(function(o){ return String(o.value) === String(draft.order_id); });
          } catch(e){ return false; }
        }, 9000);
      }).then(function(){
        try {
          if (draft.order_id && orderSel) {
            orderSel.value = String(draft.order_id);
            fillOrderInfo(String(draft.order_id));
          }
        } catch(e3) {}

        try {
          if (draft.order_created_at) setDateValue(orderCreatedAt, draft.order_created_at);
          if (draft.order_fecha_entrega_efectiva != null) setDateValue(orderEntrega, draft.order_fecha_entrega_efectiva);
          if (draft.order_fecha_pago_estimada != null) setDateValue(orderVenc, draft.order_fecha_pago_estimada);
          if (draft.order_monto != null) setMoneyInputValue(orderMonto, draft.order_monto);
          if (orderNc && draft.order_credit_note != null) setMoneyInputValue(orderNc, draft.order_credit_note);
          if (orderRet && draft.order_retenciones != null) setMoneyInputValue(orderRet, draft.order_retenciones);
          if (draft.order_notes != null) orderDesc.value = String(draft.order_notes || '');
        } catch(e4) {}

        try {
          var pm = (draft.pm || {});
          Object.keys(pm).forEach(function(prefix){
            var cfg = pm[prefix] || {};
            var amt = String(cfg.amount || '').trim();
            var dt = String(cfg.date || '').trim();
            if (!amt && !dt) return;
            var chk = document.querySelector('.pm-enable[data-prefix="' + prefix + '"]');
            if (chk) {
              chk.checked = true;
              applyPmEnabled(prefix, true, false);
            }
            var amtInp = document.querySelector('[name="' + prefix + '_amount"]');
            if (amtInp && amt) { setMoneyInputValue(amtInp, amt); }
            var dateInp = document.querySelector('[name="' + prefix + '_date"][data-datepicker]');
            if (dateInp && dt) {
              try { initDatepicker(dateInp); } catch(e5) {}
              setDateValue(dateInp, dt);
            }
          });
        } catch(e6) {}

        try {
          var rows = (draft.rows || []);
          (rows || []).forEach(function(r){
            var prefix = String(r.prefix || '').trim();
            if (!prefix || !pmCfg[prefix]) return;
            var chk = document.querySelector('.pm-enable[data-prefix="' + prefix + '"]');
            if (chk && !chk.checked) {
              chk.checked = true;
              applyPmEnabled(prefix, true, false);
            }
            addExtraItem(prefix, { amount: r.amount, date: r.date });
          });
        } catch(e7) {}

        try { updateResumen(); } catch(e8) {}
      });
    }
  } catch(e) {}
})();
</script>
{% endblock %}
