{% extends 'layout.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h1 class="h4 mb-0">Nueva cobranza</h1>
    <div class="text-muted small">Registrá pagos y/o notas de crédito para un pedido pendiente.</div>
  </div>
</div>

<div class="card mb-3">
  <div class="card-body">
    <form id="cobForm" method="post" action="{{ url_for('main.nueva_cobranza_create') }}" enctype="multipart/form-data">
      <div class="row g-3">
        <div class="col-12 col-lg-4">
          <label class="form-label">Cliente</label>
          <select class="form-select" name="client_id" id="clientSelect" required>
            <option value="">Seleccionar...</option>
            {% for c in clientes %}
              <option value="{{ c.id }}">{{ c.apellido }} {{ c.nombre }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-12 col-lg-4">
          <label class="form-label">Empresa</label>
          <select class="form-select" name="company_id" id="companySelect" required>
            <option value="">Seleccionar...</option>
          </select>
        </div>

        <div class="col-12 col-lg-4">
          <label class="form-label">Pedido</label>
          <select class="form-select" name="order_id" id="orderSelect">
            <option value="">(Opcional) Seleccionar...</option>
          </select>
        </div>
      </div>

      <hr class="my-4">

      <div class="row g-3">
        <div class="col-12 col-lg-3">
          <label class="form-label">Fecha pedido</label>
          <input class="form-control" id="orderCreatedAt" type="text" readonly>
        </div>
        <div class="col-12 col-lg-3">
          <label class="form-label">Entrega efectiva</label>
          <input class="form-control" id="orderEntrega" type="text" readonly>
        </div>
        <div class="col-12 col-lg-3">
          <label class="form-label">Vencimiento</label>
          <input class="form-control" id="orderVenc" type="text" readonly>
        </div>
        <div class="col-12 col-lg-3">
          <label class="form-label">Monto</label>
          <input class="form-control" id="orderMonto" type="text" readonly>
        </div>
        <div class="col-12">
          <label class="form-label">Nota / descripción</label>
          <textarea class="form-control" id="orderDesc" rows="4" readonly></textarea>
        </div>
      </div>

      <hr class="my-4">

      <div class="d-flex justify-content-between align-items-center mb-2">
        <h2 class="h6 mb-0">Medios de pago</h2>
      </div>

      <style>
        .pm-wrap{ display:flex; flex-wrap:wrap; gap:1rem; }
        .pm-card{ flex: 1 1 240px; min-width:240px; }
        .pm-card .form-control, .pm-card .form-select{ font-size:.95rem; }
      </style>

      <div class="pm-wrap">
        <div class="card pm-card">
          <div class="card-body">
            <div class="form-check mb-2">
              <input class="form-check-input pm-enable" type="checkbox" id="pmEfectivo" data-prefix="pm_efectivo">
              <label class="form-check-label" for="pmEfectivo">Efectivo</label>
            </div>
            <div class="row g-2">
              <div class="col-12">
                <label class="form-label mb-1">Monto</label>
                <input class="form-control" name="pm_efectivo_amount" inputmode="decimal" placeholder="0.00" disabled>
              </div>
              <div class="col-12">
                <label class="form-label mb-1">Fecha</label>
                <input class="form-control" name="pm_efectivo_date" type="text" data-datepicker placeholder="DD-MM-AAAA" disabled>
              </div>
            </div>
          </div>
        </div>

        <div class="card pm-card">
          <div class="card-body">
            <div class="form-check mb-2">
              <input class="form-check-input pm-enable" type="checkbox" id="pmTransf" data-prefix="pm_transferencia" data-requires-attach="1">
              <label class="form-check-label" for="pmTransf">Transferencia</label>
            </div>
            <div class="row g-2">
              <div class="col-12">
                <label class="form-label mb-1">Monto</label>
                <input class="form-control" name="pm_transferencia_amount" inputmode="decimal" placeholder="0.00" disabled>
              </div>
              <div class="col-12">
                <label class="form-label mb-1">Fecha</label>
                <input class="form-control" name="pm_transferencia_date" type="text" data-datepicker placeholder="DD-MM-AAAA" disabled>
              </div>
              <div class="col-12">
                <label class="form-label mb-1">Adjunto</label>
                <input class="form-control" type="file" name="pm_transferencia_attachment" disabled>
              </div>
            </div>
          </div>
        </div>

        <div class="card pm-card">
          <div class="card-body">
            <div class="form-check mb-2">
              <input class="form-check-input pm-enable" type="checkbox" id="pmEcheq" data-prefix="pm_echeq" data-requires-attach="1">
              <label class="form-check-label" for="pmEcheq">E-cheq</label>
            </div>
            <div class="row g-2">
              <div class="col-12">
                <label class="form-label mb-1">Monto</label>
                <input class="form-control" name="pm_echeq_amount" inputmode="decimal" placeholder="0.00" disabled>
              </div>
              <div class="col-12">
                <label class="form-label mb-1">Fecha</label>
                <input class="form-control" name="pm_echeq_date" type="text" data-datepicker placeholder="DD-MM-AAAA" disabled>
              </div>
              <div class="col-12">
                <label class="form-label mb-1">Adjunto</label>
                <input class="form-control" type="file" name="pm_echeq_attachment" disabled>
              </div>
            </div>
          </div>
        </div>

        <div class="card pm-card">
          <div class="card-body">
            <div class="form-check mb-2">
              <input class="form-check-input pm-enable" type="checkbox" id="pmChqTerc" data-prefix="pm_cheque_terceros">
              <label class="form-check-label" for="pmChqTerc">Cheque físico terceros</label>
            </div>
            <div class="row g-2">
              <div class="col-12">
                <label class="form-label mb-1">Monto</label>
                <input class="form-control" name="pm_cheque_terceros_amount" inputmode="decimal" placeholder="0.00" disabled>
              </div>
              <div class="col-12">
                <label class="form-label mb-1">Fecha</label>
                <input class="form-control" name="pm_cheque_terceros_date" type="text" data-datepicker placeholder="DD-MM-AAAA" disabled>
              </div>
              <div class="col-12">
                <label class="form-label mb-1">Imagen (opcional)</label>
                <input class="form-control" type="file" name="pm_cheque_terceros_attachment" disabled>
              </div>
            </div>
          </div>
        </div>

        <div class="card pm-card">
          <div class="card-body">
            <div class="form-check mb-2">
              <input class="form-check-input pm-enable" type="checkbox" id="pmChqProp" data-prefix="pm_cheque_propio">
              <label class="form-check-label" for="pmChqProp">Cheque físico propio</label>
            </div>
            <div class="row g-2">
              <div class="col-12">
                <label class="form-label mb-1">Monto</label>
                <input class="form-control" name="pm_cheque_propio_amount" inputmode="decimal" placeholder="0.00" disabled>
              </div>
              <div class="col-12">
                <label class="form-label mb-1">Fecha</label>
                <input class="form-control" name="pm_cheque_propio_date" type="text" data-datepicker placeholder="DD-MM-AAAA" disabled>
              </div>
              <div class="col-12">
                <label class="form-label mb-1">Imagen (opcional)</label>
                <input class="form-control" type="file" name="pm_cheque_propio_attachment" disabled>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="d-flex justify-content-end gap-2 mt-3">
        <a class="btn btn-light" href="{{ url_for('main.deudas_pendientes') }}">Cancelar</a>
        <button class="btn btn-primary" type="submit">Guardar cobranza</button>
      </div>
    </form>
  </div>
</div>

<script>
(function(){
  function ensureFlatpickrLoaded(cb){
    try {
      if (window.flatpickr) {
        cb && cb();
        return;
      }
      var cssId = 'flatpickr-css';
      if (!document.getElementById(cssId)) {
        var link = document.createElement('link');
        link.id = cssId;
        link.rel = 'stylesheet';
        link.href = 'https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css';
        document.head.appendChild(link);
      }
      var script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/flatpickr';
      script.onload = function(){ cb && cb(); };
      document.head.appendChild(script);
    } catch(e) {
      cb && cb();
    }
  }

  function initDatepicker(inp){
    try {
      if (!inp) return;
      if (!window.flatpickr) return;
      if (inp._flatpickr) return;
      window.flatpickr(inp, {
        dateFormat: 'Y-m-d',
        altInput: true,
        altFormat: 'd/m/Y',
        allowInput: true
      });
    } catch(e) {}
  }

  function fmtDateDMY(iso){
    try{
      const s = String(iso || '').trim();
      if (!s) return '';
      const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (!m) return s;
      return `${m[3]}/${m[2]}/${m[1]}`;
    }catch(e){
      return String(iso || '');
    }
  }

  function setDateValue(inp, iso){
    try {
      if (!inp) return;
      if (inp._flatpickr) {
        inp._flatpickr.setDate(iso || '', true, 'Y-m-d');
      } else {
        inp.value = iso || '';
      }
    } catch(e) {
      try { inp.value = iso || ''; } catch(_) {}
    }
  }

  function fmtMoney(x){
    try {
      const n = Number(x || 0);
      return n.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    } catch(e){
      return String(x || '');
    }
  }

  const clientSel = document.getElementById('clientSelect');
  const companySel = document.getElementById('companySelect');
  const orderSel = document.getElementById('orderSelect');

  const orderCreatedAt = document.getElementById('orderCreatedAt');
  const orderEntrega = document.getElementById('orderEntrega');
  const orderVenc = document.getElementById('orderVenc');
  const orderMonto = document.getElementById('orderMonto');
  const orderDesc = document.getElementById('orderDesc');

  const pmEnables = document.querySelectorAll('.pm-enable');

  let pendingOrders = [];

  function clearOrderInfo(){
    orderCreatedAt.value = '';
    orderEntrega.value = '';
    orderVenc.value = '';
    orderMonto.value = '';
    orderDesc.value = '';
  }

  function resetMovements(){
    try {
      pmEnables.forEach(ch => {
        ch.checked = false;
      });
      document.querySelectorAll('[name^="pm_"]').forEach(inp => {
        inp.disabled = true;
        if (inp.type === 'file') {
          try { inp.value = ''; } catch(e) {}
        } else {
          inp.value = '';
        }
        try { inp.required = false; } catch(e) {}
      });
      ensureFlatpickrLoaded(function(){
        try { document.querySelectorAll('[data-datepicker]').forEach(initDatepicker); } catch(e) {}
      });
    } catch(e) {}
  }

  function setCompanies(clientId){
    if (companySel) companySel.innerHTML = '<option value="">Seleccionar...</option>';
    if (orderSel) orderSel.innerHTML = '<option value="">(Opcional) Seleccionar...</option>';
    clearOrderInfo();
    pendingOrders = [];
    resetMovements();

    if (!clientId) return;
    fetch(`/api/clientes/${clientId}/empresas`)
      .then(r => r.json())
      .then(rows => {
        (rows || []).forEach(c => {
          const label = (c.label || c.nombre || '').trim();
          if (!label) return;
          const opt = document.createElement('option');
          opt.value = String(c.id);
          opt.textContent = label;
          companySel && companySel.appendChild(opt);
        });
      })
      .catch(() => {});
  }

  function setPendingOrders(clientId, companyIdVal){
    if (orderSel) orderSel.innerHTML = '<option value="">(Opcional) Seleccionar...</option>';
    clearOrderInfo();
    pendingOrders = [];
    resetMovements();
    if (!clientId || !companyIdVal) return;

    fetch(`/api/cobranzas/pedidos_pendientes?client_id=${encodeURIComponent(clientId)}&company_id=${encodeURIComponent(companyIdVal)}`)
      .then(r => r.json())
      .then(rows => {
        pendingOrders = rows || [];
        pendingOrders.forEach(o => {
          const label = `#${o.order_id} - ${o.tipo_comprobante || '-'} - ${fmtMoney(o.monto)} - Venc: ${o.fecha_pago_estimada || '-'}`;
          const opt = document.createElement('option');
          opt.value = String(o.order_id);
          opt.textContent = label;
          orderSel && orderSel.appendChild(opt);
        });
      })
      .catch(() => {});
  }

  function fillOrderInfo(orderIdVal){
    const o = (pendingOrders || []).find(x => String(x.order_id) === String(orderIdVal));
    if (!o){
      clearOrderInfo();
      resetMovements();
      return;
    }
    orderCreatedAt.value = fmtDateDMY(o.created_at || '');
    orderEntrega.value = fmtDateDMY(o.fecha_entrega_efectiva || '');
    orderVenc.value = fmtDateDMY(o.fecha_pago_estimada || '');
    orderMonto.value = fmtMoney(o.monto);
    const desc = [o.nota, o.descripcion].filter(Boolean).join('\n\n');
    orderDesc.value = desc;
  }

  function applyPmEnabled(prefix, enabled, requiresAttach){
    try {
      const fields = document.querySelectorAll(`[name^="${prefix}_"]`);
      fields.forEach(inp => {
        inp.disabled = !enabled;
        // flatpickr crea un input visible (altInput) distinto; mantenerlo sincronizado
        try {
          if (inp._flatpickr && inp._flatpickr.altInput) {
            inp._flatpickr.altInput.disabled = !enabled;
          }
        } catch(e) {}
        if (!enabled) {
          try { inp.required = false; } catch(e) {}
          if (inp.type === 'file') {
            try { inp.value = ''; } catch(e) {}
          } else {
            inp.value = '';
          }
        }
      });

      // Default fecha: hoy al habilitar (solo si está vacía)
      if (enabled) {
        try {
          const today = new Date();
          const y = today.getFullYear();
          const m = String(today.getMonth() + 1).padStart(2, '0');
          const d = String(today.getDate()).padStart(2, '0');
          const iso = `${y}-${m}-${d}`;
          const dateInp = document.querySelector(`[name="${prefix}_date"][data-datepicker]`);
          if (dateInp && !String(dateInp.value || '').trim()) {
            // asegurar flatpickr
            try { initDatepicker(dateInp); } catch(e) {}
            setDateValue(dateInp, iso);
            // si existe altInput, habilitarlo
            try {
              if (dateInp._flatpickr && dateInp._flatpickr.altInput) {
                dateInp._flatpickr.altInput.disabled = false;
              }
            } catch(e) {}
          }
        } catch(e) {}
      }
      if (enabled && requiresAttach) {
        const f = document.querySelector(`[name="${prefix}_attachment"]`);
        if (f) {
          try { f.required = true; } catch(e) {}
        }
      }
      ensureFlatpickrLoaded(function(){
        try { document.querySelectorAll(`[name^="${prefix}_"][data-datepicker]`).forEach(initDatepicker); } catch(e) {}
      });
    } catch(e) {}
  }

  clientSel.addEventListener('change', () => {
    setCompanies(clientSel.value);
    if (companySel) companySel.value = '';
    setPendingOrders(clientSel.value, '');
  });

  companySel?.addEventListener('change', () => {
    const coid = (companySel && companySel.value) ? String(companySel.value) : '';
    setPendingOrders(clientSel.value, coid);
  });

  orderSel?.addEventListener('change', () => {
    const oid = (orderSel && orderSel.value) ? String(orderSel.value) : '';
    fillOrderInfo(oid);
  });

  pmEnables.forEach(ch => {
    ch.addEventListener('change', () => {
      const prefix = ch.getAttribute('data-prefix');
      const req = ch.getAttribute('data-requires-attach') === '1';
      applyPmEnabled(prefix, ch.checked, req);
    });
  });

  resetMovements();
})();
</script>
{% endblock %}
