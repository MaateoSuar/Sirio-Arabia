{% extends 'layout.html' %}
{% block content %}
<div class="container" style="max-width: 860px;">
  <h1 class="h4 text-dark mb-4">{{ 'Editar cliente' if client else 'Nuevo cliente' }}</h1>

  <form method="post" action="{{ url_for('main.clientes_update', client_id=client.id) if client else url_for('main.clientes_create') }}" class="card shadow-sm">
    <div class="card-body">
      <style>
        .form-label { color:#0f766e; font-weight:600; letter-spacing:.2px; }
      </style>
      <div class="row g-2 g-md-3">
        <div class="col-md-6">
          <label class="form-label">Nombre</label>
          <input name="nombre" type="text" class="form-control" value="{{ client.nombre if client }}" required>
        </div>
        <!-- Datos JSON para precargar sucursales del cliente (evita Jinja dentro de JS) -->
        <script type="application/json" id="branches-data">{{ (client.branches|map(attribute='nombre')|list)|tojson if client else '[]' }}</script>
        <div class="col-md-6">
          <label class="form-label">Razón social</label>
          <input name="apellido" type="text" class="form-control" value="{{ client.apellido if client }}" required>
        </div>
        <div class="col-12">
          <div class="d-flex align-items-center justify-content-between">
            <label class="form-label m-0">Sucursales (opcional)</label>
            <div class="d-flex gap-2">
              <input type="text" class="form-control form-control-sm" id="new_branch_input" placeholder="Agregar sucursal" list="branches" style="max-width:260px">
              <button class="btn btn-sm btn-outline-secondary" type="button" id="btnAddBranch">Agregar</button>
            </div>
          </div>
          <datalist id="branches">
            {% if branches %}
              {% for b in branches %}
                <option value="{{ b }}"></option>
              {% endfor %}
            {% endif %}
          </datalist>
          <div id="branches-checklist" class="border rounded p-2 mt-2" style="max-height:200px; overflow:auto"></div>
          <div class="d-flex justify-content-end mt-2">
            <button type="button" id="btnConfirmarBranches" class="btn btn-sm btn-primary">Confirmar selección</button>
          </div>
          <div class="mt-2">
            <div class="text-muted small" style="color:#0f766e !important; font-weight:600">Sucursales confirmadas</div>
            <div id="branches-selected" class="mt-1"></div>
            <div id="branches-hidden"></div>
          </div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Dirección principal</label>
          <input name="direccion_principal" type="text" class="form-control" value="{{ client.direccion_principal if client }}">
        </div>
        <div class="col-md-6">
          <label class="form-label">Transporte recomendado</label>
          <input name="transporte_recomendado" type="text" class="form-control" value="{{ client.transporte_recomendado if client }}">
        </div>
        <div class="col-md-6">
          <label class="form-label">Provincia</label>
          <select name="provincia" class="form-select">
            <option value="">Seleccionar...</option>
            {% set pv = (client.provincia if client else '') or '' %}
            <option value="Tucuman" {{ 'selected' if pv=='Tucuman' else '' }}>Tucumán</option>
            <option value="Sgo del Estero" {{ 'selected' if pv=='Sgo del Estero' else '' }}>Sgo del Estero</option>
            <option value="Salta" {{ 'selected' if pv=='Salta' else '' }}>Salta</option>
            <option value="Jujuy" {{ 'selected' if pv=='Jujuy' else '' }}>Jujuy</option>
            <option value="Catamarca" {{ 'selected' if pv=='Catamarca' else '' }}>Catamarca</option>
            <option value="La Rioja" {{ 'selected' if pv=='La Rioja' else '' }}>La Rioja</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Contacto</label>
          <input name="telefono" type="text" class="form-control" value="{{ client.telefono if client }}">
        </div>
        <div class="col-md-6">
          <label class="form-label">Mail</label>
          <input name="mail" type="email" class="form-control" value="{{ client.mail if client }}">
        </div>
        
      </div>
    </div>
    <div class="card-footer d-flex justify-content-end gap-2">
      <a href="{{ url_for('main.clientes') }}" class="btn btn-light">Cancelar</a>
      <button class="btn btn-primary" type="submit">{{ 'Guardar cambios' if client else 'Guardar' }}</button>
    </div>
  </form>
</div>
<style>
  .date-soft { border-radius:.75rem; box-shadow:0 4px 10px rgba(0,0,0,.06); background:#fff; }
  .date-soft .input-group-text { background:#f3f4f6; border:1px solid #e5e7eb; }
  .date-soft .form-control { background:#fafafa; border:1px solid #e5e7eb; min-height:36px; font-size:.9rem; }
  .date-soft .form-control:focus { background:#fff; border-color:#86b7fe; box-shadow:0 0 0 .2rem rgba(13,110,253,.15); }
  .date-soft .btn-clear { border:1px solid #e5e7eb; background:#fff; padding:.25rem .5rem; color:#6c757d; }
  .date-soft .btn-clear:hover { background:#f8f9fa; }
  .flatpickr-calendar { z-index: 2000; }
  .flatpickr-calendar.open { z-index: 3050; }
</style>
<script>
(function(){
  // Gestión de sucursales múltiples
  var box = document.getElementById('branches-checklist');
  var list = document.getElementById('branches-selected');
  var hidWrap = document.getElementById('branches-hidden');
  var addBtn = document.getElementById('btnAddBranch');
  var input = document.getElementById('new_branch_input');
  if (!box || !list || !hidWrap) return;
  var confirmed = new Set();
  function render(){
    if (confirmed.size === 0){
      list.innerHTML = '<span class="text-muted">Ninguna</span>';
      hidWrap.innerHTML = '';
      return;
    }
    var chips = [];
    var hidden = [];
    confirmed.forEach(function(name){
      var esc = name.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      chips.push('<span class="badge bg-success text-white me-1 mb-1">'+ esc +' <button type="button" class="btn btn-sm btn-light ms-1 p-0 px-1 js-branch-del" data-branch="'+ esc +'">×</button></span>');
      hidden.push('<input type="hidden" name="branch_list" value="'+ esc +'">');
    });
    list.innerHTML = chips.join('');
    hidWrap.innerHTML = hidden.join('');
  }
  function addToChecklist(name){
    if (!name) return;
    var val = name.trim(); if (!val) return;
    // evitar duplicados visuales
    if (Array.from(box.querySelectorAll('.js-branch-chk')).some(function(c){return c.value===val;})) return;
    var row = document.createElement('div'); row.className='form-check';
    var chk = document.createElement('input'); chk.type='checkbox'; chk.className='form-check-input js-branch-chk'; chk.value=val; chk.id='br_'+btoa(val).replace(/=+/g,'');
    var lbl = document.createElement('label'); lbl.className='form-check-label'; lbl.setAttribute('for', chk.id); lbl.textContent=val;
    row.appendChild(chk); row.appendChild(lbl); box.appendChild(row);
    // auto-confirmar
    chk.checked = true; confirmSelection();
  }
  function confirmSelection(){
    box.querySelectorAll('.js-branch-chk:checked').forEach(function(chk){ var v=String(chk.value).trim(); if(v) confirmed.add(v); chk.checked=false; });
    render();
  }
  // preload de sucursales existentes del cliente (si hay) desde bloque JSON
  try {
    var jsonEl = document.getElementById('branches-data');
    var existing = [];
    if (jsonEl && jsonEl.textContent) {
      try { existing = JSON.parse(jsonEl.textContent); } catch(e) { existing = []; }
    }
    (existing||[]).forEach(function(n){ addToChecklist(n); });
  } catch(e){}
  document.addEventListener('click', function(e){
    var t = e.target;
    if (t && t.id==='btnConfirmarBranches'){ e.preventDefault(); confirmSelection(); }
    if (t && t.id==='btnAddBranch'){ e.preventDefault(); var v=(input&&input.value)||''; if(v){ addToChecklist(v); input.value=''; } }
    var delBtn = (t && t.classList && t.classList.contains('js-branch-del')) ? t : (t && t.closest ? t.closest('.js-branch-del') : null);
    if (delBtn){ e.preventDefault(); var nm = delBtn.getAttribute('data-branch'); if(nm && confirmed.has(nm)){ confirmed.delete(nm); render(); } }
  });
  // Confirmar antes de submit
  try {
    var form = document.querySelector('form.card');
    if (form) form.addEventListener('submit', function(){ confirmSelection(); });
  } catch(e){}
})();
(function(){
  function mount(){
    var nodes = document.querySelectorAll('input[data-datepicker]');
    if (!nodes.length) return;
    nodes.forEach(function(el){
      flatpickr(el, {
        altInput: true,
        altFormat: 'd/m/Y',
        dateFormat: 'Y-m-d',
        allowInput: true,
        disableMobile: true
      });
    });
    // Clear buttons
    document.querySelectorAll('button.btn-clear[data-clear]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var name = btn.getAttribute('data-clear');
        var input = document.querySelector('input[name="'+name+'"]');
        if (input) { input.value = ''; if (input._flatpickr) input._flatpickr.clear(); }
      });
    });
  }
  if (typeof window.flatpickr === 'function') {
    mount();
  } else {
    var s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/flatpickr'; s.onload = mount; document.head.appendChild(s);
    var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css'; document.head.appendChild(l);
  }
})();
</script>
{% endblock %}
