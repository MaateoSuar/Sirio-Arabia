{% extends 'layout.html' %}
{% block content %}
<div class="container" style="max-width: 860px;">
  <h1 class="h4 text-dark mb-4">{{ 'Editar empresa' if company else 'Nueva empresa' }}</h1>

  <form method="post" class="card shadow-sm">
    <div class="card-body">
      <style>
        /* Títulos y etiquetas más estéticos en esta vista */
        .form-label { color: #0f766e; font-weight: 600; letter-spacing: .2px; }
        /* Botón colapsable: mantener legible en hover/active */
        .btn-outline-secondary[data-bs-target="#clients-collapse"] { border-width: 2px; }
        .btn-outline-secondary[data-bs-target="#clients-collapse"]:hover,
        .btn-outline-secondary[data-bs-target="#clients-collapse"].active,
        .btn-outline-secondary[data-bs-target="#clients-collapse"]:focus {
          color: #0f766e; background-color: #f8fafc; border-color: #cfd8dc;
        }
        /* Badges de seleccionados */
        .badge-client { background-color: #0f766e; }
      </style>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Marca</label>
          <input name="marca" type="text" class="form-control" value="{{ company.marca if company }}">
        </div>
        <div class="col-md-6">
          <label class="form-label">Razón social</label>
          <input name="nombre" type="text" class="form-control" value="{{ company.nombre if company }}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Demora despacho promedio (días)</label>
          <input name="demora" type="number" class="form-control" min="0" value="{{ company.demora_despacho_promedio_dias if company }}">
        </div>
        <div class="col-md-6">
          <label class="form-label">Plazo de pago promedio (días)</label>
          <input name="plazo" type="number" class="form-control" min="0" value="{{ company.plazo_pago_promedio_dias if company }}">
        </div>
        <div class="col-md-6">
          {% if company %}<input type="hidden" id="company_mail_pedido_raw" value="{{ company.mail_pedido }}">{% endif %}
          <div class="mt-3">
            <div class="d-flex align-items-center justify-content-between">
              <label class="form-label m-0">Mail de pedido</label>
              <button class="btn btn-sm btn-outline-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#cmp-mails-collapse" aria-expanded="false" aria-controls="cmp-mails-collapse">Seleccionar mails</button>
            </div>
            <div id="cmp-mails-collapse" class="collapse mt-2">
              <div class="d-flex gap-2 mb-2">
                <input type="email" class="form-control form-control-sm" id="new_cmp_mail_input" placeholder="Agregar mail" style="max-width:260px">
                <button class="btn btn-sm btn-outline-secondary" type="button" id="btnAddCmpMail">Agregar</button>
              </div>
              <div id="cmp-mails-alert" class="mt-1"></div>
              <div id="cmp-mails-checklist" class="border rounded p-2" style="max-height:200px; overflow:auto"></div>
              <div class="d-flex justify-content-end mt-2">
                <button type="button" id="btnConfirmarCmpMails" class="btn btn-sm btn-primary">Confirmar selección</button>
              </div>
            </div>
            <div class="mt-2">
              <div class="text-muted small" style="color:#0f766e !important; font-weight:600">Mails confirmados</div>
              <div id="cmp-mails-selected" class="mt-1"></div>
              <div id="cmp-mails-hidden"></div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Mail de pago</label>
          <input name="mail_pago" type="email" class="form-control" value="{{ company.mail_pago if company }}">
        </div>
        <div class="col-12">
          <div class="d-flex align-items-center justify-content-between">
            <label class="form-label m-0">Vincular a clientes (opcional)</label>
            <button class="btn btn-sm btn-outline-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#clients-collapse" aria-expanded="false" aria-controls="clients-collapse">Seleccionar clientes</button>
          </div>
          <div id="clients-collapse" class="collapse mt-2">
            <div id="clients-checklist" class="border rounded p-2" style="max-height: 260px; overflow: auto;">
              {% for c in clients %}
              <div class="form-check">
                <input class="form-check-input js-client-chk" type="checkbox" value="{{ c.id }}" id="cl{{ c.id }}" name="client_ids">
                <label class="form-check-label" for="cl{{ c.id }}">{{ c.apellido }} {{ c.nombre }}</label>
              </div>
              {% endfor %}
            </div>
            <div class="d-flex justify-content-end mt-2">
              <button type="button" id="btnConfirmarClientes" class="btn btn-sm btn-primary">Confirmar selección</button>
            </div>
          </div>
          <div id="clients-selected-wrapper" class="mt-3">
            <div class="text-muted small" style="color:#0f766e !important; font-weight:600">Clientes confirmados</div>
            <div id="clients-selected" class="mt-1"></div>
            <div id="clients-hidden"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="card-footer d-flex justify-content-end gap-2">
      <a href="{{ url_for('main.empresas') }}" class="btn btn-light">Cancelar</a>
      <button class="btn btn-primary" type="submit">{{ 'Guardar cambios' if company else 'Guardar' }}</button>
    </div>
  </form>
</div>
<script>
(function(){
  var box = document.getElementById('clients-checklist');
  var list = document.getElementById('clients-selected');
  var hidWrap = document.getElementById('clients-hidden');
  if (!box || !list || !hidWrap) return;
  var confirmed = new Map(); // id -> label
  function render(){
    if (confirmed.size === 0) {
      list.innerHTML = '<span class="text-muted">Ninguno</span>';
      hidWrap.innerHTML = '';
      return;
    }
    var html = [];
    var hidden = [];
    confirmed.forEach(function(label, id){
      html.push('<span class="badge badge-client me-1 mb-1">'+ label +'</span>');
      hidden.push('<input type="hidden" name="client_ids" value="'+ id +'">');
    });
  // Asegurar que antes de enviar el formulario se confirme lo pendiente
  try {
    var form = document.querySelector('form.card');
    if (form) {
      form.addEventListener('submit', function(){
        confirmSelection();
      });
    }
  } catch(e){}
    list.innerHTML = html.join('');
    hidWrap.innerHTML = hidden.join('');
  }
  function confirmSelection(){
    var checks = box.querySelectorAll('.js-client-chk:checked');
    checks.forEach(function(chk){
      var id = String(chk.value);
      var lbl = box.querySelector('label[for="'+ chk.id +'"]');
      var label = lbl ? lbl.textContent.trim() : ('Cliente '+id);
      confirmed.set(id, label);
      chk.checked = false;
    });
    render();
  }
  document.addEventListener('click', function(e){
    var t = e.target;
    if (t && t.id === 'btnConfirmarClientes') {
      e.preventDefault();
      confirmSelection();
    }
  });
  render();
})();
</script>
<script>
(function(){
  var box = document.getElementById('cmp-mails-checklist');
  var list = document.getElementById('cmp-mails-selected');
  var hidWrap = document.getElementById('cmp-mails-hidden');
  var btnAdd = document.getElementById('btnAddCmpMail');
  var input = document.getElementById('new_cmp_mail_input');
  var alertBox = document.getElementById('cmp-mails-alert');
  var pagoInput = document.querySelector('input[name="mail_pago"]');
  if (!box || !list || !hidWrap) return;
  var confirmed = new Map();
  function render(){
    if (confirmed.size === 0){
      list.innerHTML = '<span class="text-muted">Ninguno</span>';
      hidWrap.innerHTML = '';
      return;
    }
    var chips = [];
    var hidden = [];
    confirmed.forEach(function(_, email){
      var esc = email.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      chips.push('<span class="badge bg-success text-white me-1 mb-1">'+ esc +' <button type="button" class="btn btn-sm btn-light ms-1 p-0 px-1 js-chip-del" data-email="'+ esc +'">×</button></span>');
      hidden.push('<input type="hidden" name="mail_pedido_list" value="'+ email +'">');
    });
    list.innerHTML = chips.join('');
    hidWrap.innerHTML = hidden.join('');
  }
  function isValidEmail(v){
    // Debe incluir @ y un TLD de al menos 2 letras (acepta .com, .ar, .com.ar, etc.)
    return /^[^\s@]+@[^\s@]+\.[A-Za-z]{2,}(\.[A-Za-z]{2,})*$/.test(v);
  }
  function showEmailAlert(msg){
    if (!alertBox) return;
    alertBox.innerHTML = '<div class="alert alert-warning py-1 px-2 mb-0" role="alert">'+ msg +'</div>';
  }
  function clearEmailAlert(){ if (alertBox) alertBox.innerHTML = ''; }
  function addToChecklist(email){
    if (!email) return;
    if (!isValidEmail(email)) {
      if (input){ input.classList.add('is-invalid'); }
      showEmailAlert('Formato de mail inválido. Debe incluir "@" y un dominio válido (.com, .ar, etc.).');
      return;
    }
    if (input){ input.classList.remove('is-invalid'); }
    clearEmailAlert();
    var id = 'cmp_' + btoa(email).replace(/=+/g,'');
    if (box.querySelector('#'+id)) return;
    var item = document.createElement('div');
    item.className = 'form-check';
    var chk = document.createElement('input');
    chk.type = 'checkbox'; chk.className='form-check-input js-cmp-mail-chk';
    chk.id = id; chk.value = email;
    var lbl = document.createElement('label'); lbl.className='form-check-label'; lbl.setAttribute('for', id); lbl.textContent = email;
    item.appendChild(chk); item.appendChild(lbl);
    box.appendChild(item);
    // Auto-confirmar inmediatamente lo agregado para que se persista sin pasos extra
    chk.checked = true;
    confirmSelection();
  }
  function confirmSelection(){
    var checks = box.querySelectorAll('.js-cmp-mail-chk:checked');
    checks.forEach(function(chk){
      var email = String(chk.value).trim(); if (email) confirmed.set(email, email);
      chk.checked = false;
    });
    // Si es el primer confirmado y mail_pago está vacío, auto-completar
    if (pagoInput && !pagoInput.value && confirmed.size > 0) {
      var first = confirmed.keys().next().value;
      if (first) pagoInput.value = first;
    }
    render();
  }
  document.addEventListener('click', function(e){
    var t = e.target;
    var confirmBtn = (t && (t.id === 'btnConfirmarCmpMails')) ? t : (t && t.closest ? t.closest('#btnConfirmarCmpMails') : null);
    if (confirmBtn){ e.preventDefault(); confirmSelection(); return; }
    var addBtn = (t && (t.id === 'btnAddCmpMail')) ? t : (t && t.closest ? t.closest('#btnAddCmpMail') : null);
    if (addBtn){
      e.preventDefault();
      var val = (input && input.value || '').trim();
      if (val){ addToChecklist(val); input.value=''; }
      return;
    }
    var delBtn = (t && t.classList && t.classList.contains('js-chip-del')) ? t : (t && t.closest ? t.closest('.js-chip-del') : null);
    if (delBtn){
      e.preventDefault();
      var em = delBtn.getAttribute('data-email');
      if (em && confirmed.has(em)){ confirmed.delete(em); render(); }
      return;
    }
  });
  // Preload from existing value
  var initialStr = (document.getElementById('company_mail_pedido_raw')?.value || '').trim();
  if (initialStr){
    initialStr.split(',').map(function(s){return s.trim();}).filter(Boolean).forEach(function(m){ addToChecklist(m); confirmed.set(m, m); });
  }
  // Listeners directos por si falla el delegado
  if (btnAdd){
    btnAdd.addEventListener('click', function(e){
      e.preventDefault();
      var val = (input && input.value || '').trim();
      if (val){ addToChecklist(val); input.value=''; }
    });
  }
  if (input){
    input.addEventListener('keydown', function(e){
      if (e.key === 'Enter'){
        e.preventDefault();
        var val = (input && input.value || '').trim();
        if (val){ addToChecklist(val); input.value=''; }
      }
    });
  }
  render();
})();
</script>
{% endblock %}
